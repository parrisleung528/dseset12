            // --- 歷屆試題全篇 ---
            { title: "2012 DSE", author: "韓非子", content: `今有不才之子，父母怒之弗為改，鄉人譙之弗為動，師長教之弗為變。夫以父母之愛，鄉人之行，師長之智，三美加焉而終不動其脛毛，不改；州部之吏操官兵、推公法，而求索姦人，然後恐懼，變其節，易其行矣。故父母之愛不足以教子，必待州部之嚴刑者，民固驕於愛、聽於威矣。故十仞之城，樓季弗能踰者，峭也；千仞之山，跛牂易牧者，夷也。故明王峭其法而嚴其刑也。布帛尋常，庸人不釋；鑠金百鎰，盜跖不掇。不必害，則不釋尋常；必害手，則不掇百鎰。故明主必其誅也。是以賞莫如厚而信，使民利之；罰莫如重而必，使民畏之；法莫如一而固，使民知之。故主施賞不遷，行誅無赦，譽輔其賞，毀隨其罰，則賢不肖俱盡其力矣。` },
            { title: "2013 DSE", author: "呂氏春秋", content: `齊有北郭騷者，踵門見晏子曰：「願乞所以養母。」僕謂晏子曰：「此齊國之賢者也，其義不臣乎天子，不友乎諸侯，於利不苟取，於害不苟免。今乞所以養母，是說夫子之義也。」晏子使人分倉粟府金而遺之，辭金而受粟。有間，晏子見疑於齊君，出奔，過北郭騷之門而辭。北郭騷沐浴而出見晏子曰：「夫子將焉適？」晏子曰：「見疑於齊君，將出奔。」北郭子曰：「夫子勉之矣。」晏子上車，太息而歎曰：「嬰之亡豈不宜哉？亦不知士甚矣。」晏子行，北郭子召其友而告之曰：「吾聞之曰：『養及親者，身伉其難。』今晏子見疑，吾將以身死白之。」著衣冠，令其友操劍奉笥而從，造於君庭，求復者曰：「晏子，天下之賢者也，去則齊國必侵矣。必見國之侵也，不若先死。請以頭託白晏子也。」因謂其友曰：「盛吾頭於笥中，奉以託。」退而自刎也。齊君聞之，大駭，乘驅而自追晏子，及之國郊，請而反之。晏子不得已而反，聞北郭騷之以死白己也，曰：「嬰之亡豈不宜哉？亦愈不知士甚矣。」` },
            { title: "2014 DSE", author: "史記", content: `孔子遷于蔡三歲，吳伐陳。楚救陳，軍于城父。聞孔子在陳蔡之閒，楚使人聘孔子。孔子將往拜禮，陳蔡大夫謀曰：「孔子賢者，所刺譏皆中諸侯之疾。今者久留陳蔡之閒，諸大夫所設行皆非仲尼之意。今楚，大國也，來聘孔子。孔子用於楚，則陳蔡用事大夫危矣。」於是乃相與發徒役圍孔子於野。不得行，絕糧。從者病，莫能興。孔子講誦弦歌不衰。子路慍見曰：「君子亦有窮乎？」孔子曰：「君子固窮，小人窮斯濫矣。」子貢色作。孔子曰：「賜，爾以予為多學而識之者與？」曰：「然。非與？」孔子曰：「非也。予一以貫之。」孔子知弟子有慍心，乃召子路而問曰：「《詩》云『匪兕匪虎，率彼曠野』。吾道非耶？吾何為於此？」子路曰：「意者吾未仁耶？人之不我信也。意者吾未知耶？人之不我行也。」孔子曰：「有是乎！由，譬使仁者而必信，安有伯夷、叔齊？使知者而必行，安有王子比干？」子路出，子貢入見。孔子曰：「賜，《詩》云『匪兕匪虎，率彼曠野』。吾道非耶？吾何為於此？」子貢曰：「夫子之道至大也，故天下莫能容夫子。夫子蓋少貶焉？」孔子曰：「賜，良農能稼而不能為穡，良工能巧而不能為順。君子能修其道，綱而紀之，統而理之，而不能為容。今爾不修爾道而求為容。賜，而志不遠矣！」子貢出，顏回入見。孔子曰：「回，《詩》云『匪兕匪虎，率彼曠野』。吾道非耶？吾何為於此？」顏回曰：「夫子之道至大，故天下莫能容。雖然，夫子推而行之，不容何病？不容然後見君子！夫道之不修也，是吾醜也。夫道既已大修而不用，是有國者之醜也。不容何病？不容然後見君子！」孔子欣然而笑曰：「有是哉顏氏之子！使爾多財，吾為爾宰。」於是使子貢至楚。楚昭王興師迎孔子，然後得免。` },
            { title: "2015 DSE", author: "宋濂", content: `杜環，字叔循。父友兵部主事常允恭死於九江，家破，其母張氏年六十餘，哭九江城下，無所歸。有識允恭者，憐其老，告之曰：「今安慶守譚敬先，非允恭友乎？盍往依之。」彼見母，念允恭故，必不遺棄母。母如其言，附舟詣譚，譚謝不納。母大困，念允恭嘗仕金陵，親戚交友或有存者，庶萬一可冀。復哀泣從人至金陵，問一二人，無存者。因訪一元家所在，問一元今無恙否。道上人對以「一元死已久，惟子環存，其家直鷺州坊中門內，有雙橘可辨識」。母服破衣，兩行至環家。環方對客坐，見母大驚，頗若嘗見其面者。因問曰：「母非常夫人乎？何為而至於此？」母泣告以故，環亦泣，扶就坐拜之，復呼妻子出拜。妻馬氏解衣更母濕衣，奉糜食母，抱衾寢母。母問其平生所親厚故人及幼子伯章。環知故人無在者，不足付，又不知伯章存亡，姑慰之曰：「天方雨，雨止，為母訪之。苟無人事母，環雖貧，獨不能奉母乎？且環父與允恭交好如兄弟，今母貧困，不歸他人而歸環家，此二父導之也。願母無他思。」時兵後歲饑，民骨肉不相保。母見環家貧，雨止，堅欲出問他故人。環令媵女從其行，至暮，果無所遇而返，坐乃定。越十年，環為太常贊禮郎，奉詔祠會稽，還道嘉興，逢其子伯章，泣謂之曰：「太夫人在環家，日夜念少子成疾，不可不早往見。」伯章若無所聞，第曰：「吾亦知之，但道遠不能至耳。」環歸半歲，伯章來。伯章見母老，恐不能行，竟給以他事辭去，不復顧。環奉母彌謹，然母愈念伯章，疾頓加。後三年，遂卒。將死，舉手向環曰：「吾累杜君！吾累杜君！願杜君生子孫咸如杜君！」言終而氣絕。環具棺槨殮殯之禮，買地城南鍾家山葬之，歲時常祭其墓云。史官曰：交友之道，難矣！翟公之言曰：「一死一生，乃知交情。」彼非過論也，實有見於人情而云也。人當意氣相得時，以身相許，若無難事。至事變勢窮，不能蹈其所言而背去者多矣，況既死而能養其親乎？吾觀杜環事，雖古所稱義烈之士何以過！而世俗恆謂今人不逮古人，不亦誣天下人哉！` },
            { title: "2016 DSE", author: "魏禧", content: `季子禮，既倦於遊，南極瓊海，北抵燕，於是作屋於勺庭之左扃，曰：「此真吾廬矣！」名曰吾廬。廬於翠微址最高，群山宮之，平疇崇田，參錯其下，目之所周，大約數十里，故視勺庭為勝焉。於是高下其徑，折而三之。松鳴於屋上，桃、李、梅、梨、梧桐、桂、辛夷之華，蔭於徑下，架曲直之木為檻，堊以蜃灰，光耀林木。客曰：「斗絕之山，取蔽風雨足矣。季子舉債而飾之，非也。」或曰：「其少衰乎？其將懷安也。」方季子之南遊也，驅車瘴癘之鄉，蹈不測之波，去朋友，獨身無所事事而之瓊海。至則颶風夜發屋，臥星露之下。兵變者再，索人而殺之，金鐵鳴於堂戶，屍交於衢，流血溝澮。客或以聞諸家，家人憂恐泣下，余談笑飲食自若也。及其北遊山東，方大饑，饑民十百為群，煮人肉而食。千里之地，草絕根，樹無青皮。家人聞之，益憂恐，而季子竟至燕。客有讓余者曰：「子之兄弟一身矣，又唯子言之從。今季子好舉債遊，往往無故衝危難，冒險阻，而子不禁，何也？」余笑曰：「吾固知季子之無死也。吾之視季子之舉債冒險危而遊，與舉債而飾其廬，一也。且夫人各以得行其志為適。終身守閨門之內，遇異趨越，蓋井而觀，腰舟而渡，遇三尺之溝，則色變不敢跳越，若是者，吾不強之適江湖。好極山川之奇，求朋友，攬風土之變，視客死如家，死亂如死病，江湖之死如衽席，若是者，吾不強之使守其家。孔子曰：『志士不忘在溝壑。』夫若是者，吾所不能也。吾不能而余弟能之，其志且樂為之，而吾何暇禁？」季子為余言：渡海時舟中人眩怖不敢起，獨起視海中月，作《乘月渡海歌》一首；兵變，闔門而坐，作《海南道中詩》三十首。余乃笑吾幸不憂恐泣下也。廬既成，易堂諸子，自伯兄而下皆有詩；四方之士聞者，咸以詩來會，而余為之記。` },
            { title: "2017 DSE", author: "俞長城", content: `無心公嘗蓬而面垢，客過之，視而笑。無心公疑之，窺鏡而觀，則凜然者，非人狀也。怒甚，執鏡而將毀焉。數之曰：「上古之世，美者自美，惡者自惡。予美予惡，汝何與焉！自汝之立，美惡始分。獨處則匿，相形則爭。人之不靖，職汝之因。我將毀汝之靨，而全我之真，庶其寧乎！」言未訖，有神自鏡中躍出答之曰：「嘻！子何見之謬也！夫美者爾美，非予能於爾乎美也；惡者爾惡，非予能於爾乎惡也。予告爾以美惡，爾乃增其美而飾其惡。予非欺爾也，予實助爾，予何咎焉！是故予之為物，有是非，無毀譽；有善否，無愛憎。因其來而應以往，斯已矣。夫美惡之所以分，寧獨予乎？鑒於水者，見其容也；鑒於火者，見其影也。水清故鑒，火明故照，既清且明，予實備之。爾雖毀予，能竭天下之水，而熄天下之火乎？是故堯、舜、禹、湯，君之鏡也；稷、契、伊、周，臣之鏡也；孔、孟、程、朱，士之鏡也。爾將毀我，何異秦皇之焚書以愚百姓乎？爾無怒，姑理爾首，滌爾面，而予猶惡爾，則予之毀也無恨。」無心公悔悟，於是理其首，滌其面，窺鏡而觀，天下美丈夫不過也。遂揖客而謝，鏡乃得全。是故鏡能美人惡人，而人不敢怒，自無心公始。` },
            { title: "2018 DSE", author: "李翱", content: `或曰：「貴與富在我而已，以智求則得之，不求則不得也。何命之為？」或曰：「不然。求之有不得，而不求有得之者，皆命也。人事何為？」二子出，或問曰：「二者之言，其孰是也？」對曰：「是皆陷人於不善之言也。以智而求之者，盜耕人之田者也。皆以為命者，弗耕而望收者也。吾無取焉，爾循其方，由其道，雖祿之千乘之富，舉而立諸卿大夫之上，受而不辭，非曰貪也。私於己者寡，而利於天下者多，故不辭也。何命之有焉？如取之不循其道，雖一飲之細也，猶不可受。況富貴之大耶？非曰廉也，利於人者鮮，而賊於道者多，故弗為也。何智之有焉？然則君子之術，其亦可知也。」` },
            { title: "2019 DSE", author: "劉熙載", content: `鷗於海渚遇巷燕。燕謂鷗曰：「我至子所，而子不至我所，何也？」曰：「吾性傲以野，不樂依人焉故也。」曰：「我以依人而處，故飆風得所障，凍雨得所蔽，熾日得所護。以是觀之，子其病矣！」曰：「吾病而有不病者存，不若子之昧病於未見也。」曰：「我之得以依人者，以人不之憎且愛之也。子之病我者，忮其愛乎？」曰：「子謂人之於我，愛乎？憎乎？」曰：「皆無之。」曰：「吾以傲野自適，人之憎愛，非所論也。即以人論，吾以不見愛，故不見憎。然則，見愛者其危哉！」燕不喻而去。其後巷人方食，燕泥污其羹，因怒而逐燕，燕於是始思鷗言。` },
            { title: "2020 DSE", author: "方孝孺", content: `吾居乎鄉，客遺善筆二。分其一於友人，而用其一。銳而端，圓而勁，以摹畫，咸與心稱，愛之不忍妄用，遇佳紙墨泊文辭則以書，書畢，滌而藏之。恣意率手有所作，則用其次者，是以雖甚久而猶新焉。他日友人至，問其所得，則曰弊而棄之矣。詰其用，則紀錢粟貨利卑猥事，不稍惜，視之與里巷所為偏欹軟惡者等，不知其為美也。吾聞而歎之。友人曰：「子何歎之細也，以余用斯筆也，而違其任，余則有過矣。雖然，世之用人者，得無有甚於余之用筆者乎？筆易為也，美者易得也，用久必敝，固其職也。今夫所謂賢士君子者，天之生也難，生而不夭死，不疾病，獲全其美也尤難。然而用之者，不任之以立政教，修紀法，居廟朝，治海內，而卑位冗職是命。一不快於意，不待其敝而棄之。且加不勝之法焉者，亦眾矣。不彼之歎，而於筆焉惜，是尚為知類也哉？」吾愧乎其言，謂之曰：「筆吾所任也，故吾知愛而歎之。任人非吾事也，吾其敢僭而歎乎？若姑修其可任者，以待人之任己，何暇乎世之歎，而吾之疑邪！」` },
            { title: "2021 DSE", author: "劉向", content: `楚有士申鳴者，在家而養其父，孝聞於楚國。王欲授之相，申鳴辭不受。其父曰：「王欲相汝，汝何不受乎？」申鳴對曰：「舍父之孝子而為王之忠臣，何也？」其父曰：「使有祿於國，立義於庭，汝樂吾無憂矣，吾欲汝之相也。」申鳴曰：「諾。」遂入朝，楚王因授之相。居三年，白公為亂，殺司馬子期，申鳴將往死之。父止之曰：「棄父而死，其可乎？」申鳴曰：「聞夫仕者，身歸於君而祿歸於親。今既去子事君，得無死其難乎？」遂辭而往，因以兵圍之。白公謂石乞曰：「申鳴者，天下之勇士也，今以兵圍我，吾為之奈何？」石乞曰：「申鳴者，天下之孝子也。往劫其父以兵，申鳴聞之必來，因與之語。」白公曰：「善。」則往取其父，持之以兵，告申鳴曰：「子與吾，吾與子分楚國；子不與吾，子父則死矣。」申鳴流涕而應之曰：「始吾父之孝子也，今吾君之忠臣也。吾聞之也，食其食者死其事，受其祿者畢其能。今吾已不得為父之孝子矣，乃君之忠臣也，吾何得以全身？」援桴鼓之，遂殺白公，其父亦死。王賞之金百斤。申鳴曰：「食君之食，避君之難，非忠臣也；定君之國，殺臣之父，非孝子也。名不可兩立，行不可兩全也。如是而生，何面目立於天下？」遂自殺也。` },
            { title: "2022 DSE", author: "劉向等", content: `第一則：楚共王出獵而遺其弓，左右請求之，共王曰：「止，楚人遺弓，楚人得之，又何求焉？」仲尼聞之曰：「惜乎其不大。亦曰『人遺弓，人得之』而已，何必楚也？」仲尼所謂大公也。第二則：荊人有遺弓者，而不肯索，曰：「荊人遺之，荊人得之，又何索焉？」孔子聞之曰：「去其『荊』而可矣。」老聃聞之曰：「去其『人』而可矣。」故老聃則至公矣。第三則：死生，命也，其有夜旦之常，天也。人之有所不得與，皆物之情也。……泉涸，魚相與處於陸，相呴以濕，相濡以沫，不如相忘於江湖。與其譽堯而非桀也，不如兩忘而化其道。夫大塊載我以形，勞我以生，佚我以老，息我以死。故善吾生者，乃所以善吾死也。夫藏舟於壑，藏山於澤，謂之固矣！然而夜半有力者負之而走，昧者不知也。藏小於大有宜，猶有所遯。若夫藏天下於天下，而不得所遯，是恆物之大情也。` },
            { title: "2023 DSE", author: "紀昀", content: `御史某之伏法也，有問官白晝假寐，恍惚見之，驚問曰：「君有冤耶？」曰：「言官受賂鬻章奏，於法當誅，吾何冤？」曰：「不冤，何為來見我？」曰：「有憾於君。」曰：「問官七八人，舊交如我者亦兩三人，何獨憾我？」曰：「我與君有宿隙，不過進取相軋耳，非不共戴天者也。我對簿時，君雖引嫌不問，而陽陽有德色；我獄成時，君雖虛詞慰藉，而隱隱含輕薄。是他人據法置我死，而君以修怨快我死也。患難之際，此最傷人心，吾安得不憾？」問官惶恐愧謝曰：「然則君將報我乎？」曰：「我死於法，安得報君？君居心如是，自非載福之道，亦無庸我報。特意有不平，使君知之耳。」語訖，若睡若醒，開目已失所在，案上殘茗尚微溫。後所親見其惘惘如失，陰叩之，乃具道始末，喟然曰：「幸哉我未下石也，其飲恨猶如是。曾子曰：『哀矜勿喜。』不其然乎？」所親為人述之，亦喟然曰：「一有私心，雖當其罪，猶不服，況不當其罪乎！」` },
            { title: "2024 DSE", author: "世說新語等", content: `第一則：蘇峻亂，庾冰時為吳郡，單身奔亡，民吏皆去。唯郡卒獨以小船載冰出錢塘口，蘧蒢覆之。時峻賞募覓冰，屬所在搜檢甚急。卒捨船市渚，因飲酒醉還，舞棹向船曰：「何處覓庾吳郡？此中便是。」冰大惶怖，然不敢動。監司見船小裝狹，謂卒狂醉，都不復疑。自送過浙江，寄山陰魏家，得免。後事平，冰欲報卒，適其所願。卒曰：「出自廝下，不願名器。少苦執鞭，恆患不得快飲酒。使其酒足餘年畢矣，無所復須。」冰為起大舍，市奴婢，使門內有百斛酒，終其身。時謂此卒非唯有智，且亦達生。第二則：劉伯倫常以鍤自隨，曰：「死即埋我。」蘇子曰，伯倫非達者也，棺槨衣衾，不害為達。苟為不然，死則已矣，何必更埋！` },
            { title: "2025 DSE", author: "資治通鑑等", content: `第一則：尹子奇久圍睢陽，城中食盡，議棄城東走，張巡、許遠謀，以為：「睢陽，江、淮之保障，若棄之去，賊必乘勝長驅，是無江、淮也。且我眾飢羸，走必不達。古者戰國諸侯，尚相救恤，況密邇羣帥乎！不如堅守以待之。」茶紙既盡，遂食馬；馬盡，羅雀掘鼠；雀鼠又盡，巡出愛妾，殺以食士，遠亦殺其奴；然後括城中婦人食之，既盡，繼以男子老弱。人知必死，莫有叛者，所餘才四百人。第二則：或問張巡、許遠如何，曰：「忠矣，然而未仁。殺一不辜而得天下，仁者不為，守一城而食人三萬口，其忍為之乎？寧使賊殺，豈容自食？故予嘗謂，其死節之名固千古不可磨，而食人之罪亦萬劫不能滅也。」或曰：「為己則不可，為國何害？」曰：「為己與為國等耳，天下只有一個是。」或又曰：「圖大事者不顧其小。」曰：「守城之事小，食人之事大，三萬口之命，而謂之小事，何邪？使江、淮果由此而保，亦不足道，況其未必哉。為巡等計，可走則走，不可則戰，戰不勝而死之，足以為臣之責矣；國之存亡，付之天可也。蓋當時公論亦多尤之，李翰輩曲為辨說，詎能服人之心？」` },
            { title: "2026 DSE", author: "世說新語", content: `第一則：華歆、王朗俱乘船避難，有一人欲依附，歆輒難之。朗曰：「幸尚寬，何為不可？」後賊追至，王欲舍所攜人。歆曰：「本所以疑，正為此耳。既已納其自託，寧可以急相棄邪？」遂攜拯如初。世以此定華、王之優劣。第二則：張玄之、顧敷，是顧和中外孫，皆少而聰惠。和並知之，而常謂顧勝，親重偏至，張頗不慍。於時張年九歲，顧年七歲，和與俱至寺中。見佛般泥洹像，弟子有泣者，有不泣者，和以問二孫。玄謂：「彼親故泣，彼不親故不泣。」敷曰：「不然，當由忘情故不泣，不能忘情故泣。」第三則：祖士少好財，阮遙集好屐，並恆自經營。同是一累，而未判其得失。人有詣祖，見料視財物。客至，屏當未盡，餘兩小簏著背後，傾身障之，意未能平。或有詣阮，見自吹火蠟屐，因歎曰：「未知一生當著幾量屐？」神色閑暢。於是勝負始分。` }

            "不仁者，不可以久處約，不可以長處樂。": "沒有仁德的人，不能長久處於窮困的境地，也不能長久處於安樂的境地。",

            "克己復禮為仁。": "克制自己的私慾，使言語行動都合乎禮節，這就是仁。",
            "一日克己復禮，天下歸仁焉。": "一旦能克制自己，符合禮的規範，天下的人都會贊許他是仁人。",
            "非禮勿視，非禮勿聽，非禮勿言，非禮勿動。": "不合乎禮制的不看，不合乎禮制的不聽，不合乎禮制的不說，不合乎禮制的不做。",
            "無求生以害仁，有殺身以成仁。": "不會貪生怕死而損害仁德，只會犧牲自己的生命來成全仁德。",
            "生，事之以禮；死，葬之以禮，祭之以禮。": "父母在生時，要依禮節侍奉他們；父母去世，要依禮節安葬他們，依禮節祭祀他們。",
            "今之孝者，是謂能養。": "現在所謂的孝子，只說能供養父母便夠了。",
            "至於犬馬，皆能有養；不敬，何以別乎！": "至於狗、馬都能得到飼養；如果對父母缺乏敬意，那跟飼養狗馬有甚麼分別呢？",
            "君子不重，則不威；學則不固。": "君子不莊重，就沒有威嚴；所學的也不會穩固。",
            "過，則勿憚改。": "有過錯，就不要害怕改正。",
            "君子坦蕩蕩，小人長戚戚。": "君子心胸廣闊平靜，小人卻經常憂愁煩惱。",
            "君子成人之美，不成人之惡。小人反是。": "君子成全別人的好事，不促成別人的壞事。小人卻與此相反。",
            "君子恥其言而過其行。": "君子認為說得多而做得少是可恥的。",
            "君子義以為質，禮以行之，孫以出之，信以成之。": "君子以合宜作為做事的原則，依循禮節來實行，以謙遜的言語表達，用誠實的態度完成。",
            "君子病無能焉，不病人之不己知也。": "君子只會擔憂自己沒有才能，不會擔憂別人不賞識自己。",
            "君子求諸己，小人求諸人。": "君子要求自己，小人卻要求別人。"
        };

        const form = document.getElementById('searchForm');
        const input = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');
        const dictAction = document.getElementById('dictAction');
        // 切割句子的正則表達式，遇到句號、問號、歎號等自動換行
        const sentenceSplitter = /[^。！？!\?；;\n]+[。！？!\?；;\n]?/g;

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const keyword = input.value.trim();
            if(!keyword) return;

            performSearch(keyword);
            setupDictionaryLink(keyword);
        });

        function performSearch(keyword) {
            resultsContainer.innerHTML = '';
            
            // 安全處理關鍵字，確保能準確搜尋
            const safeKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const searchRegex = new RegExp(safeKeyword, 'gi');

            let totalMatches = 0;
            const results = [];

            textsDatabase.forEach(textObj => {
                const sentences = textObj.content.match(sentenceSplitter) || [];
                sentences.forEach(sentence => {
                    if (sentence.match(searchRegex)) {
                        results.push({
                            id: 'res_' + Math.random().toString(36).substr(2, 9),
                            title: textObj.title,
                            author: textObj.author,
                            originalText: sentence.trim()
                        });
                        totalMatches++;
                    }
                });
            });

            if (totalMatches === 0) {
                resultsContainer.innerHTML = `
                    <div class="bg-red-50 text-red-600 p-6 rounded-xl border border-red-100 text-center shadow-sm">
                        <p class="text-lg font-medium">找不到包含「${keyword}」的句子。</p>
                        <p class="text-sm mt-1">請確保字詞輸入正確，或確認該篇章內容已貼入資料庫中。</p>
                    </div>
                `;
                return;
            }

            const summaryDiv = document.createElement('div');
            summaryDiv.className = 'text-slate-600 font-medium pb-2 border-b border-slate-200 mt-2';
            summaryDiv.innerText = `找到 ${totalMatches} 句包含「${keyword}」的原文：`;
            resultsContainer.appendChild(summaryDiv);

            results.forEach((res) => {
                // 將關鍵字標記為黃色底色
                const highlightedHtml = res.originalText.replace(
                    searchRegex, 
                    (match) => `<mark>${match}</mark>`
                );

                // 🔍 嘗試在資料庫中尋找有沒有配對的語譯
                let translationText = null;
                for (const [ori, trans] of Object.entries(translationsDatabase)) {
                    if (res.originalText.includes(ori) || ori.includes(res.originalText)) {
                        translationText = trans;
                        break;
                    }
                }

                const card = document.createElement('div');
                card.className = 'bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow flex flex-col';

                // 根據是否有語譯，決定顯示邏輯 (現在無論如何都會顯示 Google 按鈕)
                let translationHtml = '';
                
                if (translationText) {
                    translationHtml += `
                    <div class="mt-4 bg-emerald-50 border-l-4 border-emerald-500 p-4 rounded-r-lg mb-1">
                        <p class="text-sm font-bold text-emerald-800 mb-1">📖 標準語譯：</p>
                        <p class="text-slate-700 text-base leading-relaxed">${translationText}</p>
                    </div>
                    `;
                }

                // 常駐的 Google 搜尋備用按鈕 (設定為稍淡的灰色系以區分層次)
                translationHtml += `
                <div class="mt-3">
                    <a href="https://www.google.com/search?q=${encodeURIComponent('"' + res.title + '" ' + res.originalText + ' 語譯')}" target="_blank" rel="noopener noreferrer" class="bg-slate-50 hover:bg-slate-100 text-slate-600 px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center justify-center gap-2 w-fit border border-slate-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                        Google 搜尋語譯 ↗
                    </a>
                </div>
                `;

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2">
                            <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-2 py-1 rounded">${res.title}</span>
                            <span class="text-slate-500 text-sm font-medium border-l border-slate-300 pl-2">${res.author}</span>
                        </div>
                    </div>
                    <p class="text-lg text-slate-800 leading-relaxed mb-1 font-serif">${highlightedHtml}</p>
                    ${translationHtml}
                `;
                resultsContainer.appendChild(card);
            });
        }

        function setupDictionaryLink(keyword) {
            dictAction.classList.remove('hidden');
            if (keyword.length > 4) return dictAction.classList.add('hidden'); // 太長不顯示字典
            
            const encodedKeyword = encodeURIComponent(keyword);
            const zdicUrl = `https://www.zdic.net/hans/${encodedKeyword}`;

            dictAction.innerHTML = `
                <div class="flex flex-col sm:flex-row items-center gap-3 bg-blue-50 p-4 rounded-xl border border-blue-100 mt-2">
                    <div class="flex-grow text-blue-800 text-sm">
                        想了解單字<strong>「${keyword}」</strong>的詳細字義？
                    </div>
                    <a href="${zdicUrl}" target="_blank" rel="noopener noreferrer" class="bg-white text-blue-600 border border-blue-200 hover:bg-blue-600 hover:text-white transition-colors px-4 py-2 rounded-lg font-medium text-sm shadow-sm flex items-center gap-2">
                        前往漢典查字
                    </a>
                </div>
            `;
        }
    </script>
</body>
</html>
