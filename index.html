於是高下其徑，折而三之。松鳴於屋上，桃、李、梅、梨、梧桐、桂、辛夷之華，蔭於徑下，架曲直之木為檻，堊以蜃灰，光耀林木。
客曰：「斗絕之山，取蔽風雨足矣。季子舉債而飾之，非也。」或曰：「其少衰乎？其將懷安也。」
方季子之南遊也，驅車瘴癘之鄉，蹈不測之波，去朋友，獨身無所事事而之瓊海。至則颶風夜發屋，臥星露之下。兵變者再，索人而殺之，金鐵鳴於堂戶，屍交於衢，流血溝澮。客或以聞諸家，家人憂恐泣下，余談笑飲食自若也。
及其北遊山東，方大饑，饑民十百為群，煮人肉而食。千里之地，草絕根，樹無青皮。家人聞之，益憂恐，而季子竟至燕。
客有讓余者曰：「子之兄弟一身矣，又唯子言之從。今季子好舉債遊，往往無故衝危難，冒險阻，而子不禁，何也？」
余笑曰：「吾固知季子之無死也。吾之視季子之舉債冒險危而遊，與舉債而飾其廬，一也。且夫人各以得行其志為適。終身守閨門之內，遇異趨越，蓋井而觀，腰舟而渡，遇三尺之溝，則色變不敢跳越，若是者，吾不強之適江湖。好極山川之奇，求朋友，攬風土之變，視客死如家，死亂如死病，江湖之死如衽席，若是者，吾不強之使守其家。孔子曰：『志士不忘在溝壑。』夫若是者，吾所不能也。吾不能而余弟能之，其志且樂為之，而吾何暇禁？」
季子為余言：渡海時舟中人眩怖不敢起，獨起視海中月，作《乘月渡海歌》一首；兵變，闔門而坐，作《海南道中詩》三十首。余乃笑吾幸不憂恐泣下也。
廬既成，易堂諸子，自伯兄而下皆有詩；四方之士聞者，咸以詩來會，而余為之記。`

他日友人至，問其所得，則曰弊而棄之矣。詰其用，則紀錢粟貨利卑猥事，不稍惜，視之與里巷所為偏欹軟惡者等，不知其為美也。吾聞而歎之。
友人曰：「子何歎之細也，以余用斯筆也，而違其任，余則有過矣。雖然，世之用人者，得無有甚於余之用筆者乎？筆易為也，美者易得也，用久必敝，固其職也。今夫所謂賢士君子者，天之生也難，生而不夭死，不疾病，獲全其美也尤難。然而用之者，不任之以立政教，修紀法，居廟朝，治海內，而卑位冗職是命。一不快於意，不待其敝而棄之。且加不勝之法焉者，亦眾矣。不彼之歎，而於筆焉惜，是尚為知類也哉？」
吾愧乎其言，謂之曰：「筆吾所任也，故吾知愛而歎之。任人非吾事也，吾其敢僭而歎乎？若姑修其可任者，以待人之任己，何暇乎世之歎，而吾之疑邪！」`

            { title: "2021 DSE", author: "劉向", content: `楚有士申鳴者，在家而養其父，孝聞於楚國。王欲授之相，申鳴辭不受。其父曰：「王欲相汝，汝何不受乎？」申鳴對曰：「舍父之孝子而為王之忠臣，何也？」其父曰：「使有祿於國，立義於庭，汝樂吾無憂矣，吾欲汝之相也。」申鳴曰：「諾。」遂入朝，楚王因授之相。居三年，白公為亂，殺司馬子期，申鳴將往死之。父止之曰：「棄父而死，其可乎？」申鳴曰：「聞夫仕者，身歸於君而祿歸於親。今既去子事君，得無死其難乎？」遂辭而往，因以兵圍之。白公謂石乞曰：「申鳴者，天下之勇士也，今以兵圍我，吾為之奈何？」石乞曰：「申鳴者，天下之孝子也。往劫其父以兵，申鳴聞之必來，因與之語。」白公曰：「善。」則往取其父，持之以兵，告申鳴曰：「子與吾，吾與子分楚國；子不與吾，子父則死矣。」申鳴流涕而應之曰：「始吾父之孝子也，今吾君之忠臣也。吾聞之也，食其食者死其事，受其祿者畢其能。今吾已不得為父之孝子矣，乃君之忠臣也，吾何得以全身？」援桴鼓之，遂殺白公，其父亦死。王賞之金百斤。申鳴曰：「食君之食，避君之難，非忠臣也；定君之國，殺臣之父，非孝子也。名不可兩立，行不可兩全也。如是而生，何面目立於天下？」遂自殺也。` },
            { title: "2022 DSE", author: "劉向等", content: `第一則：楚共王出獵而遺其弓，左右請求之，共王曰：「止，楚人遺弓，楚人得之，又何求焉？」仲尼聞之曰：「惜乎其不大。亦曰『人遺弓，人得之』而已，何必楚也？」仲尼所謂大公也。第二則：荊人有遺弓者，而不肯索，曰：「荊人遺之，荊人得之，又何索焉？」孔子聞之曰：「去其『荊』而可矣。」老聃聞之曰：「去其『人』而可矣。」故老聃則至公矣。第三則：死生，命也，其有夜旦之常，天也。人之有所不得與，皆物之情也。……泉涸，魚相與處於陸，相呴以濕，相濡以沫，不如相忘於江湖。與其譽堯而非桀也，不如兩忘而化其道。夫大塊載我以形，勞我以生，佚我以老，息我以死。故善吾生者，乃所以善吾死也。夫藏舟於壑，藏山於澤，謂之固矣！然而夜半有力者負之而走，昧者不知也。藏小於大有宜，猶有所遯。若夫藏天下於天下，而不得所遯，是恆物之大情也。` },
            { title: "2023 DSE", author: "紀昀", content: `御史某之伏法也，有問官白晝假寐，恍惚見之，驚問曰：「君有冤耶？」曰：「言官受賂鬻章奏，於法當誅，吾何冤？」曰：「不冤，何為來見我？」曰：「有憾於君。」曰：「問官七八人，舊交如我者亦兩三人，何獨憾我？」曰：「我與君有宿隙，不過進取相軋耳，非不共戴天者也。我對簿時，君雖引嫌不問，而陽陽有德色；我獄成時，君雖虛詞慰藉，而隱隱含輕薄。是他人據法置我死，而君以修怨快我死也。患難之際，此最傷人心，吾安得不憾？」問官惶恐愧謝曰：「然則君將報我乎？」曰：「我死於法，安得報君？君居心如是，自非載福之道，亦無庸我報。特意有不平，使君知之耳。」語訖，若睡若醒，開目已失所在，案上殘茗尚微溫。後所親見其惘惘如失，陰叩之，乃具道始末，喟然曰：「幸哉我未下石也，其飲恨猶如是。曾子曰：『哀矜勿喜。』不其然乎？」所親為人述之，亦喟然曰：「一有私心，雖當其罪，猶不服，況不當其罪乎！」` },
            { title: "2024 DSE", author: "世說新語等", content: `第一則：蘇峻亂，庾冰時為吳郡，單身奔亡，民吏皆去。唯郡卒獨以小船載冰出錢塘口，蘧蒢覆之。時峻賞募覓冰，屬所在搜檢甚急。卒捨船市渚，因飲酒醉還，舞棹向船曰：「何處覓庾吳郡？此中便是。」冰大惶怖，然不敢動。監司見船小裝狹，謂卒狂醉，都不復疑。自送過浙江，寄山陰魏家，得免。後事平，冰欲報卒，適其所願。卒曰：「出自廝下，不願名器。少苦執鞭，恆患不得快飲酒。使其酒足餘年畢矣，無所復須。」冰為起大舍，市奴婢，使門內有百斛酒，終其身。時謂此卒非唯有智，且亦達生。第二則：劉伯倫常以鍤自隨，曰：「死即埋我。」蘇子曰，伯倫非達者也，棺槨衣衾，不害為達。苟為不然，死則已矣，何必更埋！` },
            { title: "2025 DSE", author: "資治通鑑等", content: `第一則：尹子奇久圍睢陽，城中食盡，議棄城東走，張巡、許遠謀，以為：「睢陽，江、淮之保障，若棄之去，賊必乘勝長驅，是無江、淮也。且我眾飢羸，走必不達。古者戰國諸侯，尚相救恤，況密邇羣帥乎！不如堅守以待之。」茶紙既盡，遂食馬；馬盡，羅雀掘鼠；雀鼠又盡，巡出愛妾，殺以食士，遠亦殺其奴；然後括城中婦人食之，既盡，繼以男子老弱。人知必死，莫有叛者，所餘才四百人。第二則：或問張巡、許遠如何，曰：「忠矣，然而未仁。殺一不辜而得天下，仁者不為，守一城而食人三萬口，其忍為之乎？寧使賊殺，豈容自食？故予嘗謂，其死節之名固千古不可磨，而食人之罪亦萬劫不能滅也。」或曰：「為己則不可，為國何害？」曰：「為己與為國等耳，天下只有一個是。」或又曰：「圖大事者不顧其小。」曰：「守城之事小，食人之事大，三萬口之命，而謂之小事，何邪？使江、淮果由此而保，亦不足道，況其未必哉。為巡等計，可走則走，不可則戰，戰不勝而死之，足以為臣之責矣；國之存亡，付之天可也。蓋當時公論亦多尤之，李翰輩曲為辨說，詎能服人之心？」` },
            { title: "2026 DSE", author: "世說新語", content: `第一則：華歆、王朗俱乘船避難，有一人欲依附，歆輒難之。朗曰：「幸尚寬，何為不可？」後賊追至，王欲舍所攜人。歆曰：「本所以疑，正為此耳。既已納其自託，寧可以急相棄邪？」遂攜拯如初。世以此定華、王之優劣。第二則：張玄之、顧敷，是顧和中外孫，皆少而聰惠。和並知之，而常謂顧勝，親重偏至，張頗不慍。於時張年九歲，顧年七歲，和與俱至寺中。見佛般泥洹像，弟子有泣者，有不泣者，和以問二孫。玄謂：「彼親故泣，彼不親故不泣。」敷曰：「不然，當由忘情故不泣，不能忘情故泣。」第三則：祖士少好財，阮遙集好屐，並恆自經營。同是一累，而未判其得失。人有詣祖，見料視財物。客至，屏當未盡，餘兩小簏著背後，傾身障之，意未能平。或有詣阮，見自吹火蠟屐，因歎曰：「未知一生當著幾量屐？」神色閑暢。於是勝負始分。` }

            "明月松間照，清泉石上流。": "皎皎明月從松林間灑下映照，清清泉水在山石上淙淙淌流。",
            "竹喧歸浣女，蓮動下漁舟。": "竹林中的喧鬧聲是來自歸來的洗衣女，蓮葉輕搖是因輕舟蕩下。",
            "隨意春芳歇，王孫自可留。": "任憑春天的花草凋謝，秋色仍然很美，隱士自可留在山中。",

// --- 出師表 ---
"先帝創業未半而中道崩殂，今天下三分，益州疲弊，此誠危急存亡之秋也。": "先帝（劉備）創建大業還未完成一半，中途駕崩了。如今天下已形成魏、蜀、吳三國鼎立的局面，（我們）益州地區的國力困乏，這真是局勢危急、生死存亡的時刻啊！",
"然侍衛之臣不懈於內，忠志之士忘身於外者，蓋追先帝之殊遇，欲報之於陛下也。": "然而，侍衛的臣子，在朝廷內毫不懈怠；忠心的將士，在戰場上奮不顧身，那是因為（他們）追念先帝的特別優厚的待遇，而想要報答在陛下您的身上啊！",
"誠宜開張聖聽，以光先帝遺德，恢弘志士之氣，不宜妄自菲薄，引喻失義，以塞忠諫之路也。": "陛下實在應該廣泛聽取意見，以發揚先帝遺留下來的美德，激勵志士的士氣；不應該隨便輕視自己，隨便引用不合道理的話，以致阻塞了忠臣進諫的道路。",
"宮中府中，俱為一體，陟罰臧否，不宜異同。": "皇宮中的侍臣、丞相府裏的官吏，都是一個整體（蜀漢之臣），（對他們的）提拔、懲罰、表揚、責備，不應該有不同標準。",
"若有作姦犯科及為忠善者，宜付有司論其刑賞，以昭陛下平明之理，不宜偏私，使內外異法也。": "如果有為非作歹、觸犯法令，或盡忠行善的，應該一律交予專責的主管來審議賞罰，以彰顯陛下公平清明的治理方針；不應該偏袒徇私，致使宮廷內外有不同的執法標準。",
"侍中郭攸之、費禕、侍郎董允等，此皆良實，志慮忠純，是以先帝簡拔以遺陛下。": "侍中郭攸之、費禕、侍郎董允等人，他們都賢良信實，心志思慮忠貞純正，因此先帝（劉備）選拔他們出來，留以陛下任用。",
"愚以為宮中之事，事無大小，悉以咨之，然後施行，必能裨補闕漏，有所廣益。": "微臣認為官中的事，無論大事小事，全部都應諮詢他們，然後才去施行，（這樣）必定能夠補救缺點和漏洞，提升效益。",
"將軍向寵，性行淑均，曉暢軍事，試用於昔日，先帝稱之曰能，是以眾議舉寵為督。": "（至於）將軍向寵，品性善良，行事公正，通曉軍事，從前先帝任用他時，就曾稱許他「能幹」，因此朝臣公議推舉他為中部督。",
"愚以為營中之事，悉以咨之，必能使行陣和睦，優劣得所。": "微臣認為軍中的事，不論大事小事，全部都應諮詢他，（這樣）必定能夠使軍隊團結和睦，人才優劣，各得其所。",
"親賢臣，遠小人，此先漢所以興隆也；親小人，遠賢臣，此後漢所以傾頹也。": "親近賢臣，遠離小人，這是西漢初年得以興盛的原因；親近小人，遠離賢臣，則是東漢末年所以衰亡的原因。",
"先帝在時，每與臣論此事，未嘗不歎息痛恨於桓、靈也。": "先帝（劉備）在世時，每次和臣談論這些事，沒有一次不對桓帝（劉志）、靈帝（劉宏）歎息遺憾的。",
"侍中、尚書、長史、參軍，此悉貞良死節之臣，願陛下親之信之，則漢室之隆，可計日而待也。": "侍中（郭攸之、費禕）、尚書（陳震）、長史（張裔）、參軍（蔣琬），他們都是堅貞可靠，願為節義而死的大臣，希望陛下親近他們、信任他們，那麼漢朝的興盛，就指日可待了。",
"臣本布衣，躬耕於南陽，苟全性命於亂世，不求聞達於諸侯。": "臣本是一介平民，在南陽隱居耕種，只求在亂世中苟全性命，不求在諸侯間揚名顯達。",
"先帝不以臣卑鄙，猥自枉屈，三顧臣於草廬之中，諮臣以當世之事，由是感激，遂許先帝以驅馳。": "先帝（劉備）不嫌臣出生卑微、見識鄙陋，反而屈辱自己，紆尊降貴，三次到草舍來看望臣，詢問臣對當前天下大事的看法；臣因而感動振奮，於是答應為先帝奔走效勞。",
"後值傾覆，受任於敗軍之際，奉命於危難之間，爾來二十有一年矣。": "後來（先帝）遭受戰敗，（臣）在敗軍之時接受任務，在危難之時肩負使命，至今已經二十一年了！",
"先帝知臣謹慎，故臨崩寄臣以大事也。": "先帝知道臣處事小心謹慎，所以在臨終時把（輔助陛下、復興漢室等）國家大事託付給臣。",
"受命以來，夙夜憂歎，恐託付不效，以傷先帝之明，故五月渡瀘，深入不毛。": "自接受（先帝）遺命以來，（臣）日夜為國事憂思感歎，深恐託付的任務沒有成效，因而損害了先帝知人之明。因此，（臣）在五月（冒着酷熱）帶兵渡過瀘水，深入南蠻地區（平撫叛亂）。",
"今南方已定，兵甲已足，當獎率三軍，北定中原，庶竭駑鈍，攘除姦凶，興復漢室，還於舊都。": "如今南方（的叛亂）已經平定，軍隊的裝備也很充足，應當激勵並率領全軍，北伐平定中原，希望能夠竭盡臣平庸拙劣的才能，剷除奸險凶惡的敵人（曹魏），復興大漢王朝，遷回原來的首都。",
"此臣所以報先帝而忠陛下之職分也。": "這就是臣用以報答先帝，並忠於陛下的職責本分啊！",
"至於斟酌損益，進盡忠言，則攸之、禕、允之任也。": "至於（在政事上）權衡得失、考慮取捨，毫無保留地進獻忠誠意見，那就是郭攸之、費禕、董允等人的責任了。",
"願陛下託臣以討賊興復之效，不效則治臣之罪，以告先帝之靈。": "希望陛下委任臣負責討伐逆賊、復興漢室的任務，如果不能完成任務，就懲治臣的罪過，以祭告先帝在天之靈。",
"若無興德之言，則責攸之、禕、允等之慢，以彰其咎；": "如果沒有發揚（陛下）德行的建言，就應責備郭攸之、費禕、董允等人的過錯，以表明他們怠慢失職。",
"陛下亦宜自謀，以諮諏善道，察納雅言，深追先帝遺詔。臣不勝受恩感激。": "陛下也應當自己思慮謀劃，徵詢治國良策，審察並接納正直的諫言，深切追念先帝的遺訓，（這樣，）臣就深受陛下恩德而感激不盡了。",
"今當遠離，臨表涕零，不知所言。": "如今即將離開陛下遠征，（臣）不禁對着這篇表章潸然淚下，不知道說些甚麼話了。",

            // --- 勸學（節錄） ---
            "君子曰：學不可以已。": "君子說︰學習是不可以停止的。",
            "青，取之於藍，而青於藍；冰，水為之，而寒於水。": "靛青色是從藍草中提取出來的，顏色卻比藍草的青色更青；冰，由水結成卻比水更寒冷。",
            "木直中繩，輮以為輪，其曲中規。": "樹木的枝幹本來長得筆直，並符合繩墨的要求，但用火烘烤木材使它彎曲做成車輪，它的弧度合乎圓規畫出來的圖形。",
            "雖有槁暴，不復挺者，輮使之然也。": "即使曝曬後枯乾了，也不能回復筆直的樣子，這是火烤造成的結果。",
            "故木受繩則直，金就礪則利，君子博學而日參省乎己，則知明而行無過矣。": "所以木材經繩墨測定後便會筆直，用金屬打造的刀劍放在磨刀石上打磨便會鋒利。君子廣泛地學習並每天反覆省察自己，自能知識通達，行為也不會有過失了。",
            "吾嘗終日而思矣，不如須臾之所學也；": "我曾經終日思量，卻不如片刻的學習所得；",
            "吾嘗跂而望矣，不如登高之博見也。": "我曾經踮起腳跟來張望，卻不如登上高處看得廣闊。",
            "登高而招，臂非加長也，而見者遠；": "登上高處招手，手臂並沒有加長，卻能讓遠處的人看見；",
            "順風而呼，聲非加疾也，而聞者彰。": "順着風向呼喊，聲音並沒有更雄壯和宏亮，卻能讓人聽得很清楚。",
            "假輿馬者，非利足也，而致千里；": "借助車馬的人，並不是善於走路，卻能到達千里之外的地方；",
            "假舟楫者，非能水也，而絕江河。": "借助船隻的人，並不是善於游泳，卻能橫渡江河。",
            "君子生非異也，善假於物也。": "君子的天性資質並不異於常人，只是善於借助外在的條件。",
            "積土成山，風雨興焉；積水成淵，蛟龍生焉；": "泥土堆積成山，風雨就從此興起；水流匯聚成深水之處，蛟龍就在此生長；",
            "積善成德，而神明自得，聖心備焉。": "善行積累養成德行，就能達到如同神明一般超凡入聖的境界，讓人具備聖人的精神境界。",
            "故不積跬步，無以至千里；不積小流，無以成江海。": "因此不一步一步慢慢積累腳程，就不能到達千里之外的地方；不匯聚細小的水流，就不能形成江河大海。",
            "騏驥一躍，不能十步；駑馬十駕，功在不舍。": "駿馬跳躍一下，也沒有十步那麼遠；質素低劣的馬，憑着十日的努力，也可以完成駿馬的行程。關鍵在於不放棄。",
            "鍥而舍之，朽木不折；鍥而不舍，金石可鏤。": "雕刻東西若半途而廢，即使是腐朽的木頭也不能刻斷；若不放棄持續刻下去，即使是金屬和石頭也能成功雕刻。",
            "蚓無爪牙之利，筋骨之強，上食埃土，下飲黃泉，用心一也。": "蚯蚓沒有鋒利的爪牙、強壯的筋骨，卻能吃地面上的泥土，喝地底下的泉水，這是用心專一的結果。",
            "蟹六跪而二螯，非蛇鱔之穴無可寄託者，用心躁也。": "螃蟹有六隻腳和兩隻鉗子，然而除了鮎魚和鱔的洞穴外便無處容身，這是浮躁和不專一的結果。",
            
            // --- 師說 ---
            "古之學者必有師。": "古代求學的學者一定會有老師。",
            "師者，所以傳道、受業、解惑也。": "老師就是傳授道理，講授經書課業，以及學生學習問題的人。",
            "人非生而知之者，孰能無惑？": "人並不是一生下來就懂得知識和道理，誰能夠沒有疑惑呢？",
            "惑而不從師，其為惑也，終不解矣。": "有了疑惑卻不向老師請求指教，疑惑就永遠不能解決了。",
            "生乎吾前，其聞道也固先乎吾，吾從而師之；": "在我之前出生的人，他所了解的知識和悟出的道理，本來就比我早，我跟從他並以他為師表；",
            "生乎吾後，其聞道也亦先乎吾，吾從而師之。": "而在我之後出生的人，若他懂得知識和道理也比我多，我也會跟從他學習並以他為師。",
            "吾師道也，夫庸知其年之先後生於吾乎？": "我學習的是道理，豈用理會他的年齡比我大還是比我小呢？",
            "是故無貴無賤，無長無少，道之所存，師之所存也。": "因此不管他是尊貴的、卑賤的、年長的、年輕的，道理存在的地方，便是老師所存在的地方。",
            "嗟乎！師道之不傳也久矣！欲人之無惑也難矣！": "唉！尊師重道的風氣沒有流傳很久了！想叫人沒有疑惑很難了！",
            "古之聖人，其出人也遠矣，猶且從師而問焉；": "古代的聖人，他們（的學問）超出一般常人很多，他們尚且跟從老師學習；",
            "今之衆人，其下聖人也亦遠矣，而恥學於師。": "現在一般人，跟聖人的距離已經很遠了，可是卻恥於向老師學習；",
            "是故聖益聖，愚益愚。": "所以聖人就更加聖明，愚人就更加愚昧了；",
            "聖人之所以為聖，愚人之所以為愚，其皆出於此乎？": "聖人能夠聖明的原因，而愚人還是愚昧的原因，大概就是因為這個道理吧！",
            "愛其子，擇師而教之；於其身也，則恥師焉，惑矣。": "愛惜自己的兒子，就會選擇老師來教導他們；可是對於自己本身卻把從師學習視為羞恥，實在是糊塗啊！",
            "彼童子之師，授之書而習其句讀者也，非吾所謂傳其道、解其惑者也。": "那些孩子們的老師是教他們讀書和學習書中的斷句和停頓的人，並不是我所說的傳授道理、解釋疑難的老師。",
            "句讀之不知，惑之不解，或師焉，或不焉，小學而大遺，吾未見其明也。": "句讀不懂，向老師學習；疑難不解，卻不向老師請教，小問題願意從師，大道理卻遺漏、忽略了，我看不出他的明智之處呢。",
            "巫醫、樂師、百工之人，不恥相師。": "巫醫、樂師和各類工匠的人，不會把互相學習當作羞恥。",
            "士大夫之族，曰師、曰弟子之稱者，則羣聚而笑之。": "士大夫一類的人，聽到叫「老師」、「弟子」等稱呼時，就聚在一起來嘲笑他。",
            "問之，則曰：「彼與彼年相若也，道相似也。位卑則足羞，官盛則近諛。」": "問他們原因，就會說：「他跟他年齡差不多，學問也很相近啊，拜地位低的人做老師令人實在是羞恥，拜地位高的人就近於諂媚奉承」",
            "嗚呼！師道之不復，可知矣。": "唉！從師學習的風尚不能恢復，是可以知道的！",
            "今其智乃反不能及，其可怪也歟！": "現在士大夫的才智反而比不上他們，真是令人感到奇怪啊！",
            "聖人無常師。": "聖人並沒有固定的老師。",
            "孔子師郯子、螣弘、師襄、老聃。": "孔子曾經師從郯子、萇弘、師襄、老聃等人。",
            "郯子之徒，其賢不及孔子。": "郯子這一類人，他們的道德才能當然不如孔子。",
            "孔子曰：「三人行，則必有我師。」": "孔子說：「幾個人走在一起，其中就一定有可以作為我學習的對象。」",
            "是故弟子不必不如師，師不必賢於弟子，聞道有先後，術業有專攻，如是而已。": "因此學生不一定比不上老師，老師也不一定比弟子更有賢能，懂得道理各有先後，學學問、技藝各有專長，大概就只是這樣。",
            "李氏子蟠，年十七，好古文，六經經傳皆通習之，不拘於時，學於餘。": "李家的兒子李蟠，年齡十七歲，愛好古文，六經原文和注釋的文字，全都讀明白了，他不受時俗所拘限，向我學習。",
            "餘嘉其能行古道，作《師說》以貽之。": "我讚賞他能夠踐行古人從師之道，寫了這篇《師說》來送給他。",
            
                        // --- 始得西山宴遊記 ---
            "自余為戮人，居是州，恆惴慄。": "自從我成為罪人，居住在永州，經常憂懼不安。",
            "其隙也，則施施而行，漫漫而游。": "空閑時，就緩步行走，隨意遊覽，",
            "日與其徒上高山，入深林，窮迴谿，幽泉怪石，無遠不到。": "每天與同伴攀登高山，走入深林。我們走遍曲折的山間小溪，幽深隱僻山泉，看了不少怪異的山石，無論多遠都去遊歷。",
            "到則披草而坐，傾壺而醉。": "到了就撥開雜草坐下，傾盡壺中的酒，喝到大醉。",
            "醉則更相枕以臥，臥而夢。": "喝醉後便相互枕靠着睡在地上，躺下就做夢。",
            "意有所極，夢亦同趣。": "心中想到了那裏，做夢也就到了那裏。",
            "覺而起，起而歸。": "醒了就起來，起來了就回家。",
            "以為凡是州之山水有異態者，皆我有也，而未始知西山之特異。": "我以為凡是永州特異的山水，我都遊覽過，卻未曾知道西山風景的奇異獨特。",
            "今年九月二十八日，因坐法華西亭，望西山，始指異之。": "今年九月二十八日，因為坐在法華寺的西亭，遙望西山，才發現它與別不同之處。",
            "於是拔聲僕夫，濟湘江，緣染溪，斫榛莽，焚茅籫，攀援而登，箕踞而遨，則凡數州之土壤，皆在席下一覽中。": "我於是命令僕人越過湘江，沿染溪行進，砍去雜亂叢生的草木，燒掉茂密的茅草，一直爬到山的最高處才止步。我們攀援登上山頂，隨意張開雙腿席地而坐，游目四盼，附近幾個州的土地，都在我的坐席之下。",
            "岈然窪然，若垤若穴，尺寸千里，攢蹙累積，莫得遁隱。": "周圍高低起伏的地勢，高峻的和凹陷的樣子，高山像一個一個小土堆，山谷恍如局促的蟻穴，眼前尺寸之間的距離，實際上相隔千里之遙。遠處的山聚攏、堆積在一起，無所隱藏。",
            "縈青繚白，外與天際，四望如一。": "青山白水互相繚繞，與遙遠的天空相接，四周望去渾然為一，",
            "然後知是山之特出，不與培塿為類。": "這時才知道西山獨特出眾，不與那些小土丘相類。",
            "悠悠乎與顥氣俱，而莫得其涯；洋洋乎與造物者遊，而不知其所窮。": "廣遠無盡的景象，彷彿和天地大氣合一，沒有邊際；這景象多麼廣闊壯觀啊，好像與大自然一起遊覽，不知道盡頭。",
            "引觴滿酌，頹然就醉，不知日之入。": "我拿起酒杯斟滿酒，飲得醉倒，不知不覺間便日落西山。",
            "蒼然暮色，自遠而至，至無所見而猶不欲歸。": "蒼茫暮色，自遠而近，直到天黑得甚麼也看不見了，而我仍未想歸去。",
            "心凝形釋，與萬化冥合。": "我的精神凝聚安定，形體得到解脫，和大自然暗暗相合。",
            "然後知吾嚮之未始游，遊於是乎始，故為之文以志是年，時元和四年也。": "然後才知道我過往的遊覽未曾算得上遊覽過山水，真正的遊覽山水這次才是開始，所以我把這件事記載下來。這一年是元和四年。",


                        // --- 六國論 ---
            "六國破滅，非兵不利，戰不善，弊在賂秦。": "六國的滅亡，不是因爲他們的兵器不鋒利，軍隊作戰失誤，癥結在於贈送財物討好秦國。",
            "賂秦而力虧，破滅之道也。": "拿土地賄賂秦國，而國力損耗，這就是滅亡的關鍵原因。",
            "或曰：「六國互滅，斯拉夫賂秦耶？」": "有人問：「六國一個接一個的滅亡，難道全部都是因爲賄賂秦國嗎？」",
            "曰：「不賂者以賂者亡。蓋失強援，不能獨完。故曰：弊在賂秦也。」": "（回答）說：「不賄賂秦國的國家因爲賄賂秦國的國家而滅亡。原因是不賄賂秦國的國家失掉了強大支援，不能獨自完好無缺。所以說：弊病在於賄賂秦國。」",
            "秦以攻取之外，小則獲邑，大則獲城。": "秦國除了用戰爭奪取土地以外，小的就獲得邑鎮，大的就獲得城都。",
            "較秦之所得，與戰勝而得者，其實百倍；": "比較因六國奉獻而得到的土地與戰勝別國所得到的土地，前者實際多百倍。",
            "諸侯之所亡，與戰敗而亡者，其實亦百倍。": "六國諸侯因討好秦國而失去的土地與戰敗所喪失的土地相比，實際也是多百倍。",
            "則秦之所大欲，諸侯之所大患，固不在戰。": "那麼秦國最想要的，與六國諸侯最擔心的，本來就是戰爭。",
            "思厥先祖父，暴霜露，斬荊棘，以有尺寸之地。": "想到他們的祖先，冒着風霜雨露，斬除荊棘，才有了很少的一點土地。",
            "子孫視之不甚惜，舉以予人，如棄草芥。": "子孫卻很不愛惜那些土地，全都拿來送給別人，就像扔掉小草一樣不珍惜。",
            "今日割五城，明日割十城，然後得一夕安寢。": "今天割掉五座城，明天捨棄十座城，然後能睡一夜安穩覺。",
            "起視四境，而秦兵又至矣。": "明天起牀一看四周邊境，秦國的軍隊又來了。",
            "然則諸侯之地有限，暴秦之欲無厭，奉之彌繁，侵之愈急。": "既然這樣，那麼諸侯的土地有限，強暴的秦國的慾望永遠不會滿足，送給他的土地越多，他侵犯諸侯國土就越急迫。",
            "故不戰而強弱勝負已判矣。": "所以不用戰爭，誰強誰弱，誰勝誰負，就已經分清了。",
            "至於顛覆，理固宜然。": "到了覆滅的地步,道理本來就是這樣子的。",
            "古人云：「以地事秦，猶抱薪救火，薪不盡，火不滅。」此言得之。": "古人說：「用土地侍奉秦國，就像抱柴救火，柴不燒完，火就不會滅。」這話說出其中道理。",
            "齊人未嘗賂秦，終繼五國亡，何哉？": "齊國不曾賄賂秦國，可是最終也隨著五國亡國了，爲什麼呢？",
            "與嬴而不助五國也。": "是因爲齊國結交秦國而助其餘五國。",
            "五國既亡，齊亦不免矣。": "五國滅亡了，齊國也就沒法倖免了。",
            "燕、趙之君，始有遠略，能守其土，義不賂秦。": "燕國和趙國的國君，起初有長遠的謀略，能夠守住他們的國土，堅持正義，不割地賄賂秦國。",
            "故燕雖小國，而後亡，是兵革之聲也。": "因此燕國雖然是個小國，卻後來才滅亡，這就是用兵抗秦的效果。",
            "至丹以荊卿為計，始速禍焉。": "等到後來燕太子丹用派遣荊軻刺殺秦王作對付秦國的計策，這才招致了滅亡的禍患。",
            "趙嘗五戰於秦，二敗而三勝。": "趙國曾經與秦國交戰五次，兩場敗仗，三場勝仗。",
            "後秦擊趙者再，李牧連卻之。": "後來秦國兩次攻打趙國，趙國大將李牧接連打退秦國的進攻。",
            "及牧以讒誅，邯鄲為郡，惜其用武而不終也。": "等到李牧因受誣陷而被殺死，邯鄲變成秦國的一個郡，可惜趙國用武力抗秦卻沒能堅持到底。",
            "且燕、趙處秦革滅殆盡之際，可謂智力孤危，戰敗而亡，誠不得已。": "而且燕趙兩國能處於秦國差不多完全消滅其他國家時，可說是智謀窮竭，國勢孤立危急，戰敗了而亡國，確實是無可奈何的事。",
            "向使三國各愛其地，齊人不附於秦，燕不用刺客之計，良將如李牧，則勝負之數，存亡之理，與秦相較，或未易量。": "假使韓、魏、楚三國都愛惜他們的國土，齊國不結交秦國，燕國不以刺客為計行刺秦王，趙國的良將李牧還活着，那麼勝敗的命運，存亡的理數，倘若與秦國相比較，勝負存亡，或許不易估量呢。",
            "悲夫！有如此之勢，而為秦人積威之所劫，日削月割，以趨於亡。": "唉！如果六國諸侯用賄賂秦國的土地，分封給天下間有謀略的臣子，有這樣的形勢，卻被秦國久積的威勢所威脅，天天割地，月月割地，以至於走向滅亡！",
            "為國者無使為積威之所劫哉！": "治理國家的人無須被久積的威勢所威脅啊！",
            "夫六國與秦皆諸侯，其勢弱於秦，而猶有可以不賂而勝之之勢。": "六國和秦國都是諸侯之國，六國的勢力比秦國弱，卻仍然有不賄賂秦國而戰勝它的優勢；",
            "苟以天下之大，下而從六國破亡之故事，是又在六國下矣。": "如果憑藉偌大的國家，卻重蹈六國破亡的覆轍，這就比不上六國了！",

            // --- 廉頗藺相如列傳（節錄） ---
            "廉頗者，趙之良將也。": "廉頗，是趙國的傑出將領。",
            "趙惠文王十六年，廉頗為趙將，伐齊，大破之，取陽晉，拜為上卿，以勇氣聞於諸侯。": "趙惠文王十六年，廉頗做了趙國的大將，領兵攻打齊國，大敗齊軍，奪取了陽晉，獲任命為上卿，憑着勇猛善戰而在諸侯國之間聞名。",
            "藺相如者，趙人也，為趙宦者令繆賢舍人。": "藺相如，趙國人，是趙國宦官頭目繆賢的侍從。",
            "趙惠文王時，得楚和氏璧。秦昭王聞之，使人遺趙王書，願以十五城請易璧。": "趙惠文王的時候，得到楚國的和氏璧。秦昭王聽到了這件事，派人送給趙王一封信，願意用十五座城換取這塊璧。",
            "趙王與大將軍廉頗諸大臣謀：欲予秦，秦城恐不可得，徒見欺；欲勿予，即患秦兵之來。": "趙王跟大將軍廉頗等大臣商議：要是把這塊玉璧給秦國，恐怕秦國的城邑得不到，白白被欺騙了；要是不給，就擔心秦國的軍隊到來。",
            "計未定，求人可使報秦者，未得。": "計策還沒有定下來，徵求可以作為使臣去答覆秦國的人，卻沒能找到。",
            "宦者令繆賢曰：「臣舍人藺相如可使。」": "宦官頭目繆賢說：「我的侍從藺相如可以擔當這個差使。」",
            "王問：「何以知之？」": "趙王問：「憑甚麼知道他可以呢?」",
            "對曰：「臣嘗有罪，竊計欲亡走燕，臣舍人相如止臣，曰：『君何以知燕王？』": "繆賢回答說：「我曾經犯了罪，私下打算逃跑到燕國去。我的門客藺相如勸阻我說：『您憑甚麼了解燕王呢？』",
            "臣語曰：『臣嘗從大王與燕王會境上，燕王私握臣手，曰「願結友」。以此知之，故欲往。』": "我告訴他說：『我曾跟着大王到邊境上與燕王會面，燕王私下握着我的手，說願意交個朋友。我了解他，所以打算投奔去。』",
            "相如謂臣曰：『夫趙強而燕弱，而君幸於趙王，故燕王欲結於君。今君乃亡趙走燕，燕畏趙，其勢必不敢留君，而束君歸趙矣。君不如肉袒伏斧質請罪，則幸得脫矣。』": "相如對我說：『趙國強大而燕國弱，而您又得到趙王寵幸，所以燕王想和您交朋友。現在您卻是從趙國逃跑去燕國，燕國害怕趙國，他們勢必不敢收留您，反而會把您綁起來送回趙國。您不如赤身伏在刑具上請求大王處罰，或許僥倖能得到赦免。』",
            "臣從其計，大王亦幸赦臣。臣竊以為其人勇士，有智謀，宜可使。」": "我按照他的辦法去做，幸而大王赦免了我。我認為他這個人是個勇士，又有智謀，可供差使。」",
            "於是王召見，問藺相如曰：「秦王以十五城請易寡人之璧，可予不？」": "於是趙王召見，問藺相如說：「秦王要用十五座城換我的和氏璧，可以給予他嗎？」",
            "相如曰：「秦強而趙弱，不可不許。」": "相如說：「秦國強大，趙國弱小，不能不答應。」",
            "王曰：「取吾璧，不予我城，奈何？」": "趙王說：「拿了我的和氏璧，卻不給我城邑，那怎麼辦呢?」",
            "相如曰：「秦以城求璧而趙不許，曲在趙；趙予璧而秦不予趙城，曲在秦。均之二策，寧許以負秦曲。」": "相如說：「秦王用城來換璧而趙國不答應，理虧的是趙國；趙國給了璧而秦國不給趙國城邑，理虧的是秦國。比較這兩個對策，寧可答應將和氏璧給予秦國，使它負上理虧的責任。」",
            "王曰：「誰可使者？」": "趙王問：「誰可以擔任使者呢?」",
            "相如曰：「王必無人，臣願奉璧往使。城入趙而璧留秦；城不入，臣請完璧歸趙。」": "相如說：「大王假如沒有人選，我願捧着和氏璧出使秦國。城歸入趙國，璧就留在秦國；城不歸入趙國，我就把璧玉完完整整地帶回趙國。」",
            "趙王於是遂遣相如奉璧西入秦。": "趙王就派相如帶着璧往西去秦國。",
            "秦王坐章臺見相如，相如奉璧奏秦王。秦王大喜，傳以示美人及左右，左右皆呼萬歲。": "秦王在章臺上接見藺相如。藺相如捧着和氏璧獻給秦王。秦王高興極了，把璧遞給妃嬪和近臣看，大家高呼萬歲。",
            "相如視秦王無意償趙城，乃前曰：「璧有瑕，請指示王。」": "藺相如看出秦王沒有把城抵償給趙國的意思，就走上前去說：「這璧有斑點，讓我指給大王看。」",
            "王授璧，相如因持璧卻立，倚柱，怒髮上衝冠，謂秦王曰：": "秦王把璧交給他，藺相如於是握着璧後退幾步站立，靠着殿柱，憤怒得頭髮都要豎起來了，對秦王說：",
            "「大王欲得璧，使人發書至趙王，趙王悉召羣臣議，皆曰：『秦貪，負其強，以空言求璧，償城恐不可得。』議不欲予秦璧。": "「大王想得到和氏璧，派人送信給趙王，趙王召集所有大臣來商議，都說：『秦國貪婪，恃著國力強大，用空話來求取璧，抵償的城恐怕得不到。』商議不打算把和氏璧給秦國。",
            "臣以為布衣之交尚不相欺，況大國乎！且以一璧之故逆強秦之歡，不可。": "我以為平民百姓的交往尚且互不欺騙，何況是大國呢？而且為了一塊璧的緣故違反與強大的秦國之間的友好關係，不可取。",
            "於是趙王齋戒五日，使臣奉璧，拜送書於庭。何者？嚴大國之威以修敬也。": "於是趙王就齋戒了五天，派我捧着和氏璧，並在朝廷上行了禮，送出國書。為甚麼會這樣？是尊重你們大國的威望以表示敬意啊。",
            "今臣至，大王見臣列觀，禮節甚倨；得璧，傳之美人，以戲弄臣。臣觀大王無意償趙王城邑，故臣復取璧。": "現在我來到，大王只在一般的宮殿裏接見我，禮節十分傲慢；得到璧後，把它傳給美人看，用來戲弄我。我看大王沒有誠意把城給趙王，所以我又把璧取回。",
            "大王必欲急臣，臣頭今與璧俱碎於柱矣！」": "您如果一定要逼我的話，我的頭立刻與和氏璧一同在這柱子上碰個粉碎！」",
            "相如持其璧睨柱，欲以擊柱。": "藺相如拿着和氏璧斜眼看着廷柱，準備拿它去撞擊廷柱。",
            "秦王恐其破璧，乃辭謝固請，召有司案圖，指從此以往十五都予趙。": "秦王怕他撞碎玉璧，於是婉言道歉，堅決請求藺相如不要這樣做，同時召喚負責掌管版圖的官吏按着地圖，指着從這裏到那裏的十五座城給予趙國。",
            "相如度秦王特以詐詳為予趙城，實不可得，乃謂秦王曰：「和氏璧，天下所共傳寶也，趙王恐，不敢不獻。趙王送璧時，齋戒五日，今大王亦宜齋戒五日，設九賓於廷，臣乃敢上璧。」": "藺相如估計秦王只是以狡詐的話假裝給趙國都城，實際上不可得到，就對秦王說：「和氏璧是天下所公認的寶物，趙王害怕，不敢不獻上。他送璧的時候曾齋戒了五天，現在大王也應當齋戒五天，在朝廷上舉行九賓大禮，我才敢獻上璧。」",
            "秦王度之，終不可強奪，遂許齋五日，舍相如廣成傳。": "秦王估量了一下，知道終究不能強奪，就答應齋戒五天，安置藺相如住在廣成傳裏。",
            "相如度秦王雖齋，決負約不償城，乃使其從者衣褐，懷其璧，從徑道亡，歸璧於趙。": "藺相如推測秦王雖說答應齋戒，但必定會違背約定不以城來抵償，於是命令他的隨從穿着粗布便衣，懷裏藏着和氏璧，循小路逃走，把和氏璧送回趙國。",
            "秦王齋五日後，乃設九賓禮於廷，引趙使者藺相如。": "秦王齋戒五天後，就在朝廷上設九賓大禮，引見趙國使者藺相如。",
            "相如至，謂秦王曰：「秦自繆公以來二十餘君，未嘗有堅明約束者也。臣誠恐見欺於王而負趙，故令人持璧歸，間至趙矣。": "相如來到，對秦王說：「秦國自從秦穆公以來的二十多個國君，未曾有堅守信約的君主。我實在怕被大王欺騙而辜負趙國，所以派人帶着和氏璧，已從偏僻的小路回到趙國了。",
            "且秦強而趙弱，大王遣一介之使至趙，趙立奉璧來。今以秦之強而先割十五都予趙，趙豈敢留璧而得罪於大王乎？": "再說秦國強而趙國弱，大王派一個使者到趙國去，趙國馬上就捧着璧前來。現在以秦國的強盛而先割十五座城給趙國，趙國怎麼敢留着和氏璧而得罪大王呢？",
            "臣知欺大王之罪當誅，臣請就湯鑊，唯大王與羣臣孰計議之。」": "我知道欺騙了大王應得死罪，我請求受湯鑊之刑。希望大王與羣臣仔細商量這件事！」",
            "秦王與羣臣相視而嘻。左右或欲引相如去，": "秦王和羣臣面面相覷，發出既驚且怒的聲音。左右的人有些想把相如拉出去，",
            "秦王因曰：「不如因而賀之，使歸趙。趙王豈以一璧之故欺秦邪？」": "秦王於是說：「不如就此好好地對待他，讓他回趙國去。難道趙王怎會因為一塊璧玉的緣故而欺騙我們秦國呢？」",
            "卒廷見相如，畢禮而歸之。": "終於在朝廷上接見了藺相如，舉行儀式後送他回國。",
            "藺相如既歸，趙王以相如功大，拜為上大夫。秦亦不以城予趙，趙亦終不予秦璧。": "藺相如回國以後，趙王認為他勝過一般大夫，出使諸侯之國，能不受欺辱，任命相如做上大夫。秦國也沒有把城邑給趙國，趙國終於也沒有給秦國和氏璧。",
            "廉頗聞之，肉袒負荊，因賓客至藺相如門謝罪，曰：「鄙賤之人，不知將軍寬之至此也！」": "廉頗聽到這些話，便赤裸上身，背著荊條，由門客引領着到藺相如的府第謝罪，說：「我這鄙賤的人，不曉得將軍寬大厚道到這個地步啊！」",
            "卒相與歡，為刎頸之交。": "兩人終於和好，成了誓同生死的朋友。",
            
            // --- 岳陽樓記 ---
            "慶曆四年春，滕子京謫守巴陵郡。": "慶曆四年的春天，滕子京被貶官到巴陵郡擔任太守。",
            "越明年，政通人和，百廢具興。": "到了第二年，政事順利，百姓和樂，各種荒廢了的事業都興辦起來了。",
            "乃重修岳陽樓，增其舊制，刻唐賢今人詩賦於其上。": "於是他重新修築岳陽樓，擴大它原有的規模，把唐代名家和當代文人的詩賦刻在樓上，",
            "屬予作文以記之。": "並囑託我寫一篇文章來記述這件事。",
            "予觀夫巴陵勝狀，在洞庭一湖。": "我看那巴陵郡的美好景色，全集中在洞庭湖上。",
            "銜遠山，吞長江，浩浩湯湯，橫無際涯；": "它含著遠方的山脈，吞吐著長江的流水，水勢浩大廣闊，無邊無際；",
            "朝暉夕陰，氣象萬千。": "早晨陽光明媚、傍晚暮靄陰沉，景象千變萬化。",
            "此則岳陽樓之大觀也，前人之述備矣。": "這就是岳陽樓雄偉壯麗的景觀，前人的記述已經很詳盡了。",
            "然則北通巫峽，南極瀟湘，遷客騷人，多會於此，覽物之情，得無異乎？": "既然如此，那麼這裡向北通往巫峽，向南直達瀟水和湘水，被貶職流遷的官員和失意的文人墨客，大多在這裡聚會，他們觀賞景物時所產生的感情，難道不會有所不同嗎？",
            "若夫霪雨霏霏，連月不開，陰風怒號，濁浪排空；": "像那連綿不斷的雨紛紛下著，接連幾個月都不放晴；陰冷的風怒吼著，渾濁的巨浪衝向天空；",
            "日星隱曜，山岳潛形；商旅不行，檣傾楫摧；": "太陽和星星隱藏了光輝，山岳也潛藏了形跡；商人和旅客無法通行，船桅傾倒、船槳折斷；",
            "薄暮冥冥，虎嘯猿啼。": "傍晚時分天色昏暗，老虎咆哮、猿猴悲啼。",
            "登斯樓也，則有去國懷鄉，憂讒畏譏，滿目蕭然，感極而悲者矣。": "在這個時候登上這座樓，就會產生離開國都、懷念家鄉，擔心人家說壞話、懼怕人家批評指責的心情，滿眼都是蕭條冷落的景象，感慨到了極點而悲傷起來啊。",
            "至若春和景明，波瀾不驚，上下天光，一碧萬頃；": "至於到了春風和煦、陽光明媚的時候，湖面平靜，沒有驚濤駭浪，天色湖光相接，一片碧綠，廣闊無際；",
            "沙鷗翔集，錦鱗游泳；岸芷汀蘭，鬱鬱青青。": "沙洲上的鷗鳥時而飛翔、時而停歇，美麗的魚兒在水裡游來游去；岸上的白芷和小洲上的蘭花，香氣濃郁，枝葉茂盛青翠。",
            "而或長煙一空，皓月千里，浮光躍金，靜影沉璧，漁歌互答，此樂何極！": "有時大片煙霧完全消散，皎潔的月光一瀉千里，波動的水面閃動著金光，靜謐的月影宛如沉入水中的白玉璧；漁夫的歌聲一唱一和，這種快樂哪有窮盡！",
            "登斯樓也，則有心曠神怡，寵辱皆忘，把酒臨風，其喜洋洋者矣。": "在這個時候登上這座樓，就會感到胸懷開闊、精神愉快，榮耀和屈辱全都忘卻，端著酒杯迎著微風，真是喜氣洋洋啊！",
            "嗟夫！予嘗求古仁人之心，或異二者之為，何哉？": "唉！我曾經探求古代品德高尚之人的心思，或許和以上這兩種人的表現不同。為什麼呢？",
            "不以物喜，不以己悲；": "他們不因為外境的好壞而高興，也不因為個人的得失而悲傷。",
            "居廟堂之高則憂其民；處江湖之遠則憂其君。": "在朝廷做高官時，就為百姓擔憂；不在朝廷做官而身處偏遠的民間時，就替君主擔憂。",
            "是進亦憂，退亦憂。": "這樣看來，出仕做官也擔憂，退隱不做官也擔憂，",
            "然則何時而樂耶？": "那麼他們什麼時候才快樂呢？",
            "其必曰「先天下之憂而憂，後天下之樂而樂」乎。": "他們必定會說：「在天下人擔憂之前先擔憂，在天下人享樂之後才享樂」吧！",
            "噫！微斯人，吾誰與歸？": "唉！如果沒有這樣的人，我還能和誰同道呢？",

                        // --- 逍遙遊（節錄） ---
            "惠子謂莊子曰：「魏王貽我大瓠之種，我樹之成而實五石。": "惠子對莊子說：「魏王送我大葫蘆瓜的種子，我栽種它，結出的果實有五石容量那麼大。",
            "以盛水漿，其堅不能自舉也。": "用來盛水，它的堅固程度承受不了所盛的水。",
            "剖之以為瓢，則瓠落無所容。": "把它剖開當作水瓢，則瓢身太大，沒有可以容納它的容器。",
            "非不呺然大也，吾為其無用而掊之。」": "這個葫蘆瓜並非不虛空而巨大的樣子，但我因為它沒有用處，就把它打碎了。」",
            "莊子曰：「夫子固拙於用大矣！": "莊子說：「你實在不善於使用大的東西啊！",
            "宋人有善為不龜手之藥者，世世以洴澼絖為事。": "有個宋國人善於調製預防雙手龜裂的藥物，他家世世代代都以漂洗棉絮為業。",
            "客聞之，請買其方百金。": "有一個客人聽聞這種藥，願意用百金買下他的藥方。",
            "聚族而謀曰：『我世世為洴澼絖，不過數金；今一朝而鬻技百金，請與之。』": "宋國人聚集家族成員一起商量：『我們世世代代漂洗棉絮，只得到很少收入，現在一旦賣出這個藥方就可以獲得百金，就把藥方賣給他吧！』",
            "客得之，以說吳王。": "客人得到藥方後，便去游說吳王。",
            "越有難，吳王使之將。": "正巧越國興兵來犯，吳王派客人擔任將領，",
            "冬，與越人水戰，大敗越人，裂地而封之。": "冬天和越軍於水上交戰，大敗越軍，吳王於是割地封賞他。",
            "能不龜手一也，或以封，或不免於洴澼絖，則所用之異也。": "同樣一條能夠令手不龜裂的藥方，有人因此得到封地，有人卻只能用來漂洗棉絮，這就是使用的方法不同啊。",
            "今子有五石之瓠，何不慮以為大樽而浮乎江湖，而憂其瓠落無所容？": "如今你有五石容量的大葫蘆瓜，為何不考慮繫着當作腰舟而浮游於江湖之上？你卻擔憂葫蘆太大而沒有器皿可以容納它，",
            "則夫子猶有蓬之心也夫！」": "看來你還是未能通達道理啊！」",
            "惠子謂莊子曰：「吾有大樹，人謂之樗。": "惠子跟莊子說：「我有一棵大樹，人們稱它為『樗樹』。",
            "其大本擁腫而不中繩墨，其小枝卷曲而不中規矩。": "它的大樹幹盤結，而合乎木匠合繩墨的要求，它的小枝彎彎曲曲，而不合乎圓規畫圓形，曲尺畫直線的要求。",
            "立之塗，匠者不顧。": "生長在道路旁，木匠都不會多看它一眼。",
            "今子之言，大而無用，眾所同去也。」": "現在你的言論，大而無用，大家都拋棄。」",
            "莊子曰：「子獨不見狸狌乎？": "莊子說：「你沒見過野貓嗎？",
            "卑身而伏，以候敖者；": "牠們彎下身軀躲藏着，等待那些走過的小動物。",
            "東西跳梁，不辟高下；中於機辟，死於罔罟。": "捕捉獵物時東跳西躍，不避高低；往往踏中機關，死於獵網之中。",
            "今夫斄牛，其大若垂天之雲。": "現在那些旄牛，龐大的身體就像天邊的雲。",
            "此能為大矣，而不能執鼠。": "牠可以說夠大了，卻不能捕捉老鼠。",
            "今子有大樹，患其無用，何不樹之於無何有之鄉，廣莫之野，彷徨乎無為其側，逍遙乎寢臥其下。": "現在你有這麼一棵大樹，卻擔憂它沒有用處，為何不把它種在空闊無垠的原野上？廣大的曠野，隨意地在樹旁徜徉，自在地在樹下躺卧。",
            "不夭斤斧，物無害者，無所可用，安所困苦哉！」": "大樹不遭受斧頭砍伐，沒有東西來侵害它，它沒有甚麼用處，又怎麼會有禍害呢？」",

            // --- 魚我所欲也 ---
            "魚，我所欲也，熊掌，亦我所欲也；二者不可得兼，舍魚而取熊掌者也。": "孟子說：「魚，是我想要的，熊掌，也是我想要的。倘若這兩者不能同時擁有，我寧可捨棄魚而選擇熊掌。",
            "生亦我所欲也，義亦我所欲也；二者不可得兼，舍生而取義者也。": "生命，也是我想要的；道義，也是我想要的。如果兩者不能同時擁有，我就捨棄生命而選擇大義。",
            "生亦我所欲，所欲有甚於生者，故不為苟得也；": "生命是我所喜愛的，然而我還喜愛更勝過生命的東西，所以我不會苟且偷生；",
            "死亦我所惡，所惡有甚於死者，故患有所不辟也。": "死亡是我所厭惡的，但我還厭惡超過死亡的事，所以有的災禍我不躲避。",
            "如使人之所欲莫甚於生，則凡可以得生者，何不用也？": "如果人們所喜愛的東西沒有比生命更重要的，那麼凡是能夠用來求得生存的手段，為什麼不可以採用呢？",
            "使人之所惡莫甚於死者，則凡可以辟患者，何不為也？": "如果人們厭惡的事情沒有被死亡更討厭的，那麼凡是可以躲避禍害的手段，為甚麼不去做呢？",
            "由是則生而有不用也，由是則可以辟患而有不為也，是故所欲有甚於生者，所惡有甚於死者。": "憑這些方法就可以生存，有人卻不用；憑這些方法就可以躲避禍患，有人卻不願意這樣做。是因爲人所追求的東西，有些比生命更重要；人所憎惡的東西，有些比死亡更嚴重。",
            "非獨賢者有是心也，人皆有之，賢者能勿喪耳。": "不僅賢人有這個「本心」，其實人人都有，唯獨賢人能夠堅持本心，不讓它喪失罷了。",
            "一簞食，一豆羹，得之則生，弗得則死。": "一筐飯，一碗湯，吃了便可以活下去，不吃就會餓死。",
            "嘑爾而與之，行道之人弗受；": "輕蔑地呼喝著把食物給人吃，流浪者不會接受；",
            "蹴爾而與之，乞人不屑也。": "踐踏後給人吃，乞丐也不屑接受；",
            "萬鍾則不辯禮義而受之。萬鍾於我何加焉？": "為了優厚的俸祿，不分辨是否合於禮義就接受。這高官厚祿對我有什麼好處呢？",
            "為宮室之美、妻妾之奉、所識窮乏者得我與？": "為了住宅的華美、妻妾的侍奉，讓所認識的窮乏之人感謝我的賙濟嗎？",
            "鄉為身死而不受，今為宮室之美為之；": "過往有人寧願犧牲自己的生命都不接受，現在卻為了華美的居室而接受了；",
            "鄉為身死而不受，今為妻妾之奉為之；": "過往有人寧願犧牲自己的生命都不接受，現在有人卻為了妻妾的侍奉而接受了；",
            "鄉為身死而不受，今為所識窮乏者得我而為之，是亦不可以已乎？此之謂失其本心。": "過往有人寧願犧牲自己的生命都不接受，現在有人卻為了所認識的窮人感激自己卻接受了。這些做法不能停止嗎？這就是說喪失了羞惡之心。",

            // --- 論仁、論孝、論君子 ---
            "子曰：「不仁者，不可以久處約，不可以長處樂。仁者安仁，知者利仁。」": "孔子說：「沒有仁德的人，是不可以長久地身處於窮困之中，不可以長期過着安樂的生活。有仁德的人安於實行仁德，有智慧的人藉着實行仁德而得到利益。」",
            "子曰：「富與貴，是人之所欲也；不以其道得之，不處也。貧與賤，是人之所惡也；不以其道得之，不去也。君子去仁，惡乎成名？君子無終食之間違仁，造次必於是，顛沛必於是。」": "孔子說：「財富和顯貴，是人人嚮往的；不是以正當的方法得到，便不要享受。貧困和卑賤，是人人厭惡的；如果不是以正當的方法擺脫，便不要逃避。君子拋棄了仁德，怎樣成就他的名聲呢？即使短至一頓飯的時間，君子也不會違背仁德，就算在倉卒緊迫的時候也必定如此，在顛沛流離的的時候也必定如此。」",
            "顏淵問仁。子曰：「克己復禮為仁。一日克己復禮，天下歸仁焉。為仁由己，而由人乎哉？」": "顏淵問甚麼是仁德。孔子說：「克制自己的私慾，使言行舉止合乎禮節，就是仁德。一旦做到這樣，普天下的人都會歸服你的仁德。實行仁德要靠的是自己，難道還能靠別人嗎？」",
            "顏淵曰：「請問其目。」子曰：「非禮勿視，非禮勿聽，非禮勿言，非禮勿動。」": "顏淵道：「請問實行仁德有甚麼條目？」孔子道：「不看不合乎禮節的事，不聽不合乎禮節的說話，不說不合乎禮節的話語，不做不合乎禮節的事情。」",
            "顏淵曰：「回雖不敏，請事斯語矣。」": "顏淵道：「我雖然不聰敏，請允許我照着這些話去做。」",
            "子曰：「志士仁人，無求生以害仁，有殺身以成仁。」": "孔子說：「有節操的人和有仁德的人之中，沒有會因貪生怕死而損害仁義的人，只有犧牲自己的生命來成全仁義的人。」",
            "孟懿子問孝。子曰：「無違。」": "孟懿子問甚麼是孝道。孔子曰：「不要違背禮節。」",
            "樊遲御，子告之曰：「孟孫問孝於我，我對曰，無違。」樊遲曰：「何謂也？」子曰：「生，事之以禮；死，葬之以禮，祭之以禮。」": "樊遲替孔子駕車，孔子告訴他說：「孟孫問我盡孝之道，我回答說，不要違背禮節。」樊遲說：「這是甚麼意思呢？」孔子說：「父母健在時，依規定的禮節侍奉他們；父母去世，依規定的禮節安葬他們、祭祀他們。」",
            "子游問孝。子曰：「今之孝者，是謂能養。至於犬馬，皆能有養；不敬，何以別乎！」": "子游問甚麼是孝道。孔子說：「現在所謂的孝道，就是說能夠供養父母。即使是狗、馬，都能得到食物來飼養，如果對父母沒有心存敬意，這跟飼養狗、馬有甚麼分別呢？」",
            "子曰：「事父母幾諫，見志不從，又敬不違，勞而不怨。」": "孔子說：「侍奉父母時，如果父母有不對的地方，要委婉地勸告；看到自己的規勸沒有獲得父母接納，仍要恭敬而不冒犯他們；因多次勸諫父母而勞苦，但不抱怨。」",
            "子曰：「父母之年，不可不知也。一則以喜，一則以懼。」": "孔子說：「父母的年齡，不能夠不知道。一方面因他們長壽而高興，一方面因他們年事已高而恐懼。」",
            "子曰：「君子不重，則不威；學則不固。主忠信。無友不如己者。過，則勿憚改。」": "孔子說：「君子不莊重，就不會有威嚴，所學的也不會鞏固。行事以忠信為主，不會跟與自己不同道的人交朋友。犯了錯，就不要害怕改正。」",
            "子曰：「君子坦蕩蕩，小人長戚戚。」": "孔子說：「君子總是心胸舒坦寬廣，小人卻經常局促憂愁。」",
            "司馬牛問君子。子曰：「君子不憂不懼。」": "司馬牛問甚麼是君子。孔子說：「君子不憂愁，不恐懼。」",
            "曰：「不憂不懼，斯謂之君子已乎？」子曰：「內省不疚，夫何憂何懼？」": "司馬牛再問：「不憂愁，不恐懼，這樣就可以稱為君子了嗎」孔子說：「自己問心無愧，還有甚麼需要憂愁和恐懼呢？」",
            "子曰：「君子成人之美，不成人之惡。小人反是。」": "孔子說：「君子成全別人的好事，不促成別人的壞事。小人則與此相反。」",
            "子曰：「君子恥其言而過其行。」": "孔子說：「君子會因為自己說得多，但做得少而感到羞恥。」",
            "子曰：「君子義以為質，禮以行之，孫以出之，信以成之。君子哉！」": "孔子說：「君子處事，以合宜為原則。依禮節實行它，用謙遜的言語說出它，用誠實的態度完成它。這就是君子了！」",
            "子曰：「君子病無能焉，不病人之不己知也。」": "孔子說：「君子只會因自己沒有能力而慚愧，卻不會抱怨別人不了解自己。」",
            "子曰：「君子求諸己，小人求諸人。」": "孔子說：「君子要求自己，小人則只會要求別人。」",

            
            // --- 五蠹 (2012 DSE) ---
            "今有不才之子，父母怒之弗為改，鄉人譙之弗為動，師長教之弗為變。": "現在有一位不成器的人，父母責備他，他不知悔悟；鄉里責罵他，他不為所動，師長教導他，他也不肯改變。",
            "夫以父母之愛，鄉人之行，師長之智，三美加焉而終不動其脛毛，不改；": "用父母的慈愛、鄉里的行動、師長的智慧，三種美意施加於他身上，但最終也不能動他腿上的一根毛，仍不改過。",
            "州部之吏操官兵、推公法，而求索姦人，然後恐懼，變其節，易其行矣。": "直到地方官吏率領官兵，推行國法，憑此來搜捕壞人，他才懼怕起來，改變了自己的想法，改變了自己的行為。",
            "故父母之愛不足以教子，必待州部之嚴刑者，民固驕於愛、聽於威矣。": "所以父母的慈愛不足夠教導子女，一定要依靠地方官吏施行嚴刑（才產生效用），（因為）百姓本來受到慈愛就會放縱，（面對）聽命於威勢就會遵從。",
            "故十仞之城，樓季弗能踰者，峭也；千仞之山，跛牂易牧者，夷也。": "因此，十仞高的城，樓季也不能超越，（因為）太陡峭了；千仞高的山，（就算是）跛腳的母羊也易於放牧，（因為）平坦。",
            "故明王峭其法而嚴其刑也。": "所以英明的君主施行嚴刑峻法。",
            "布帛尋常，庸人不釋；鑠金百鎰，盜跖不掇。": "幾尺的布帛，普通人都不會放棄，鎔化了的百鎰黃金，盜跖也不會拿取。",
            "不必害，則不釋尋常；必害手，則不掇百鎰。故明主必其誅也。": "不用受到傷害，少量的布匹也不放棄，雙手一定會受傷害，就不會拿取百鎰黃金。所以英明的君主一定會執行懲罰。",
            "是以賞莫如厚而信，使民利之；罰莫如重而必，使民畏之；法莫如一而固，使民知之。": "因此獎賞最好是豐厚而信實，令百姓覺得有利；刑罰最好是嚴峻而果決，令百姓懼怕；法令最好是統一而肯定，令百姓有所認知。",
            "故主施賞不遷，行誅無赦，譽輔其賞，毀隨其罰，則賢不肖俱盡其力矣。": "所以君主給予獎賞而不會隨意改變，施行刑罰而絕不赦免，用稱譽輔助獎賞，詆毀伴隨刑罰，則賢能和不成器的人都會竭盡全力了。",
            
            // --- 士節 (2013 DSE) ---
            "齊有北郭騷者，結罘罔，𦈌蒲葦，織萉履，以養其母，猶不足，踵門見晏子曰：": "齊國有個叫北郭騷的人，他靠着織結捕鳥獸的網，用香蒲蘆葦編織器物，用麻草編織成鞋，仍不足供養他的母親。（他）登門求見晏子說：",
            "「願乞所以養母。」": "「希望請求你幫助以供養母親。」",
            "晏子之僕謂晏子曰：「此齊國之賢者也，其義不臣乎天子，不友乎諸侯，於利不苟取，於害不苟免。": "晏子的下人對晏子說：「這是齊國的賢人，他處事的原則是不臣服於天子，不和諸侯結交，面對利益不隨便取用，面對禍患不會隨便逃避。",
            "今乞所以養母，是說夫子之義也，必與之。」": "現在來請求你幫助供養母親，是因為欣賞你重道義，一定要資助他。」",
            "晏子使人分倉粟府金而遺之，辭金而受粟。": "於是晏子叫人把倉庫中的糧食和金錢分發給他，（北郭騷）只接受糧食而謝絕了金錢。",
            "有間，晏子見疑於齊君，出奔，過北郭騷之門而辭。": "過了一段時間，晏子被齊君懷疑，（計劃）逃亡，經過北郭騷的家門向他告辭。",
            "北郭騷沐浴而出見晏子曰：「夫子將焉適？」": "北郭騷沐浴之後走出來見晏子，說：「先生打算前往哪裏？」",
            "晏子曰：「見疑於齊君，將出奔。」": "晏子說：「受到齊君猜疑，即將逃亡。」",
            "北郭子曰：「夫子勉之矣。」": "北郭騷說：「先生盡力而為啊！」",
            "晏子上車，太息而歎曰：「嬰之亡豈不宜哉？亦不知士甚矣。」": "晏子登上車，大聲嘆氣說：「晏嬰要逃亡難道不應該嗎？（我）也不認識士啊！」",
            "晏子行，北郭子召其友而告之曰：": "晏子離開後。北郭騷叫他的朋友來告訴他說：",
            "「吾說晏子之義，嘗乞所以養母者也。吾聞之曰：『養及親者，身伉其難。』今晏子見疑，吾將以身死白之。」": "「（我）欣賞晏子的道義，曾經請求他供養（我的）母親。我聽說：『供養自己至親的人，自身就要擔當他的危難。』現在晏子被猜忌，我將用我的生命來還他清白。」",
            "著衣冠，令其友操劍奉笥而從，造於君庭，求復者曰：": "穿戴好衣冠，叫他的朋友拿着劍捧着竹製器皿跟隨其後，到了齊君的大殿前，向通報的人請求說：",
            "「晏子，天下之賢者也，去則齊國必侵矣。必見國之侵也，不若先死。請以頭託白晏子也。」": "「晏子，是天下間的賢人，（他）離開後齊國必定會受到（別國）進犯，與其見到國家被進犯，不如早點死。請把我的頭交託（結齊王）以還晏子清白。」",
            "因謂其友曰：「盛吾頭於笥中，奉以託。」退而自刎也。其友因奉以託。": "於是對他的朋友說：「把我的頭放於竹製器皿中，捧着他交託（於通報的人）。」（北郭騷）退下來以劍割頸自殺，他的朋友捧着他的頭交託（於通報的人）。",
            "其友謂觀者曰：「北郭子為國故死，吾將為北郭子死。」又退而自刎。": "他的朋友向旁觀的人說：「北郭騷為國家的重大變故而死，我將為（我的好友）北郭子而死。」又退下來用劍割頸自殺。",
            "齊君聞之，大駭，乘驅而自追晏子，及之國郊，請而反之。": "齊君聽到這件事，十分驚訝，乘馬車親自追回晏子，到了國都的郊外才追到，（齊君）請求晏子返回齊國。",
            "晏子不得已而反，聞北郭騷之以死白己也，曰：「嬰之亡豈不宜哉？亦愈不知士甚矣。」": "晏子無可奈何返回（齊國），聽到北郭騷用死來還自己的清白，說：「晏嬰要逃亡難道不應該嗎？（我）愈發現自己不認識士啊！」",

            
            // --- 孔子世家 (2014 DSE) ---
            "孔子遷于蔡三歲，吳伐陳。楚救陳，軍于城父。": "孔子遷居到蔡國的第三年，吳國軍隊攻伐陳國。楚國出兵援救陳國，駐紮在城父。",
            "聞孔子在陳蔡之閒，楚使人聘孔子。": "聽說孔子在陳國、蔡國之間，楚昭王派人聘請孔子。",
            "孔子將往拜禮，陳蔡大夫謀曰：": "孔子準備前往拜見回禮，陳國、蔡國的大夫謀劃說：",
            "「孔子賢者，所刺譏皆中諸侯之疾。今者久留陳蔡之閒，諸大夫所設行皆非仲尼之意。": "「孔子是個賢人，他所譏諷的皆能切中諸侯的缺失。如今他長久滯留在陳國、蔡國之間，眾大夫所作所為都違背仲尼的心意。",
            "今楚，大國也，來聘孔子。孔子用於楚，則陳蔡用事大夫危矣。」": "如今楚國是大國，派人前來聘請孔子，倘若孔子在楚國被起用，我們這些在陳國、蔡國主事的大夫就危險了。」",
            "於是乃相與發徒役圍孔子於野。不得行，絕糧。從者病，莫能興。": "於是就共同調發役使將孔子圍困在野外。孔子沒法行走，斷絕了糧食。隨從的弟子疲憊不堪，餓得站不起來。",
            "孔子講誦弦歌不衰。": "但孔子仍講習誦讀，演奏歌唱，傳授詩書禮樂毫不間斷。",
            "子路慍見曰：「君子亦有窮乎？」": "子路很生氣，來見孔子說：「君子也有窮困嗎？」",
            "孔子曰：「君子固窮，小人窮斯濫矣。」": "孔子說：「君子能固守窮困而不動搖，小人窮困就胡作非為了。」",
            "子貢色作。孔子曰：「賜，爾以予為多學而識之者與？」": "子貢怒氣發作。孔子說：「賜啊，你以為我是個博學強識的人嗎？」",
            "曰：「然。非與？」孔子曰：「非也。予一以貫之。」": "子貢說：「是。難道不是嗎？」孔子說：「不是啊。我是用一個思想貫串於全部學說。」",
            "孔子知弟子有慍心，乃召子路而問曰：": "孔子知道弟子們有怨怒之心，就召見子路而詢問道：",
            "「《詩》云『匪兕匪虎，率彼曠野』。吾道非耶？吾何為於此？」": "「《詩》中說：『不是犀牛也不是老虎，卻疲於奔命在空曠的原野。』我們的學說難道有不對的地方嗎？我們為什麼淪落到這個地步？」",
            "子路曰：「意者吾未仁耶？人之不我信也。意者吾未知耶？人之不我行也。」": "子路說：「猜想我們還沒有達到『仁』吧！所以別人不信任我們。猜想我們還沒有達到『智』吧！所以別人不實行我們的學說。」",
            "孔子曰：「有是乎！由，譬使仁者而必信，安有伯夷、叔齊？使知者而必行，安有王子比干？」": "孔子說：「有這些緣由嗎！仲由，我打比方給你聽，假如仁者就必定受到信任，那怎麼還會有伯夷、叔齊？假如智者就必定能行得通，那怎麼還會有王子比干？」",
            "子路出，子貢入見。孔子曰：「賜，《詩》云『匪兕匪虎，率彼曠野』。吾道非耶？吾何為於此？」": "子路出去，子貢進來見面。孔子說：「賜啊，《詩》中說：『不是犀牛也不是老虎，卻疲於奔命在空曠的原野。』我們的學說難道有不對的地方嗎？我們為什麼淪落到這個地步？」",
            "子貢曰：「夫子之道至大也，故天下莫能容夫子。夫子蓋少貶焉？」": "子貢說：「老師的學說極其宏大。所以天下沒有國家能容得下您。老師是否可以稍微降低一點標準呢？」",
            "孔子曰：「賜，良農能稼而不能為穡，良工能巧而不能為順。": "孔子說：「賜，優秀的農夫善於播種耕耘卻不能保證獲得好收成，優秀的工匠擅長工藝技巧卻不能迎合所有人的要求。",
            "君子能修其道，綱而紀之，統而理之，而不能為容。": "君子能夠修明自己的學說，用法度來規範國家，用道統來治理臣民，但不能保證被世道所容忍。",
            "今爾不修爾道而求為容。賜，而志不遠矣！」": "如今你不修明你奉行的學說卻去追求被世人收容。賜，你的志向太不遠大了！」",
            "子貢出，顏回入見。孔子曰：「回，《詩》云『匪兕匪虎，率彼曠野』。吾道非耶？吾何為於此？」": "子貢出去，顏回入門進見。孔子說：「回啊，《詩》中說：『不是犀牛也不是老虎，卻疲於奔命在空曠的原野。』我們的學說難道有不對的地方嗎？我們為什麼淪落到這個地步？」",
            "顏回曰：「夫子之道至大，故天下莫能容。雖然，夫子推而行之，不容何病？不容然後見君子！": "顏回說：「老師的學說極其宏大，所以天下沒有國家能夠容納。即使如此，老師推廣而實行它，不被容納怕什麼？正是不被容納，然後才現出君子本色！",
            "夫道之不修也，是吾醜也。夫道既已大修而不用，是有國者之醜也。不容何病？不容然後見君子！」": "老師的學說不修明，這是我們的恥辱。老師的學說已經宏大美好而不被採用，這是當權者的恥辱。不被容納怕什麼？不被容納然後才現出君子本色！」",
            "孔子欣然而笑曰：「有是哉顏氏之子！使爾多財，吾為爾宰。」": "孔子高興地笑道：「有道理啊，顏家的孩子！假使你擁有許多財產，我給你當管家。」",
            "於是使子貢至楚。楚昭王興師迎孔子，然後得免。": "於是孔子派子貢到達楚國。楚昭王派兵迎接孔子，孔子然後得以脫身。",

                        // --- 杜環小傳 (2015 DSE) ---
            "杜環，字叔循。父友兵部主事常允恭死於九江，家破，其母張氏年六十餘，哭九江城下，無所歸。": "杜環，字叔循。杜父的朋友兵部主事常允恭在九江死了，家庭破碎，他的母親張氏，年紀六十多歲，在九江城下痛哭，沒有依託的地方。",
            "有識允恭者，憐其老，告之曰：「今安慶守譚敬先，非允恭友乎？盍往依之。」": "有認識常允恭的人，可憐常母年紀老邁，就告訴她說：「現在的安慶太守譚敬先，不就是常允恭的朋友嗎？何不前去投靠。",
            "彼見母，念允恭故，必不遺棄母。母如其言，附舟詣譚，譚謝不納。": "他見到老人家，顧念和允恭的交情，必定不會遺棄老人家。」常母按照那人的話去做，乘船請求譚敬先收留，譚卻拒絕而不願收留。",
            "母大困，念允恭嘗仕金陵，親戚交友或有存者，庶萬一可冀。": "常母非常困窘，想到允恭曾經在金陵做官，也許有親戚朋友居於這地方，或許有萬分之一的希望。",
            "復哀泣從人至金陵，問一二人，無存者。": "再次悲痛地哭泣着跟隨別人到金陵。詢問過一二個人，都已經離世了。",
            "因訪一元家所在，問一元今無恙否。": "於是詢問杜一元家的地址，並問杜一元的近況。",
            "道上人對以「一元死已久，惟子環存，其家直鷺洲坊中門內，有雙橘可辨識」。": "途人這樣回答：「杜一元已死了一段時間，但他的兒子杜環仍在生；他的家就在鷺洲坊中門內，（門前）有兩株橘樹可作記認。」",
            "母服破衣，兩行至環家。": "常母穿着破爛的衣服，冒雨走到杜環家裏。",
            "環方對客坐，見母大驚，頗若嘗見其面者。": "杜環正與賓客一起，見到常母大吃一驚，好像是曾經見過面。",
            "因問曰：「母非常夫人乎？何為而至於此？」": "於是問道：「你不是常老夫人嗎？為甚麽會到這裏來？」",
            "母泣告以故，環亦泣，扶就坐拜之，復呼妻子出拜。": "常母邊哭邊告訴杜環原因，杜環（聽到）也哭了出來。杜環扶着常母就座，向她下拜禮。再叫妻子兒女出來下拜。",
            "妻馬氏解衣更母濕衣，奉糜食母，抱衾寢母。": "環妻馬氏脫下衣服更換常母沾濕的衫，捧着粥餵給常母吃，又抱着被子讓常母就寢。",
            "母問其平生所親厚故人及幼子伯章。": "常母問起允恭交情深厚的舊友近況和小兒子伯章（的情況）。",
            "環知故人無在者，不足付，又不知伯章存亡，姑慰之曰：": "杜環知道允恭的舊友沒有一個在這兒，不能夠交託，又不知道伯章的死活，暫且安慰她說：",
            "「天方雨，雨止，為母訪之。苟無人事母，環雖貧，獨不能奉母乎？": "「現在正下雨，雨停之後，（我）替老人家訪尋他們吧！假如沒有人事奉老人家，杜環雖然貧窮，難道就不能奉養老人家嗎？",
            "且環父與允恭交好如兄弟，今母貧困，不歸他人而歸環家，此二父導之也。願母無他思。」": "況且杜環先父和允恭情同兄弟，現在老人家貧窮困頓，（母）不到別人家裏去而偏偏走到杜環家中，這就是兩位仙人指引所致啊！希望老人家不要多想了。」",
            "時兵後歲饑，民骨肉不相保。": "當時正是戰爭過後饑荒的年頭，百姓連親身骨肉都難以保全。",
            "母見環家貧，雨止，堅欲出問他故人。": "常母看到杜環家境貧窮，雨停後，就堅決地要訪尋允恭的舊友。",
            "環令媵女從其行，至暮，果無所遇而返，坐乃定。": "杜環就叫侍婢跟隨身後。到了傍晚，（常母）果然一無所獲而回，（常母）才決定定居下來。",
            "越十年，環為太常贊禮郎，奉詔祠會稽，還道嘉興，逢其子伯章，泣謂之曰：": "過了十年，杜環擔任太常贊禮郎，奉皇命去會稽山祭祀，回程時路經嘉興，遇到了（常母）小兒子伯章。哭着對他說：",
            "「太夫人在環家，日夜念少子成疾，不可不早往見。」": "「太夫人在杜環家裏，（因為）日夜思念小兒子而病倒，不可以不早點去看見（她）啊！」",
            "伯章若無所聞，第曰：「吾亦知之，但道遠不能至耳。」": "伯章像聽不到似的，只是說：「我也知道，可是路途遙遠不能去啊。」",
            "環歸半歲，伯章來。伯章見母老，恐不能行，竟給以他事辭去，不復顧。": "杜環回家半年後，伯章來到（環家）。伯章見到母親年紀老邁，恐怕她無法遠行，竟然欺騙她有其他事要辦而溜走了，再也沒有回來看望她。",
            "環奉母彌謹，然母愈念伯章，疾頓加。後三年，遂卒。": "杜環更加謹慎地事奉常母，但是常母更加思念小兒伯章，病情突然加重了，三年之後就死了。",
            "將死，舉手向環曰：「吾累杜君！吾累杜君！願杜君生子孫咸如杜君！」言終而氣絕。": "常母臨死之時，舉起手對杜環說：「我拖累了杜君！我拖累了杜君！盼望杜君所生的子子孫孫都能夠像你一樣。」說完這段話就斷了氣。",
            "環具棺槨殮殯之禮，買地城南鍾家山葬之，歲時常祭其墓云。": "杜環替她準備了所有的喪葬禮儀，買城南鍾家山的地給她安葬，一年四季都去那兒拜祭。",
            "史官曰：交友之道，難矣！翟公之言曰：「一死一生，乃知交情。」彼非過論也，實有見於人情而云也。": "史官說：「和朋友交往的道理真是太深奧啊！翟公曾說過：『人到生死關頭，才能夠看出朋友的交情。』他的看法並非言過其實，實在是有感於現實中的世態才這樣說啊！",
            "人當意氣相得時，以身相許，若無難事。": "人們在意氣相投的時候，常用自己的生命來作承諾，彷彿世上並無難事。",
            "至事變勢窮，不能蹈其所言而背去者多矣，況既死而能養其親乎？": "可是到了事勢變遷、情勢窘迫的時候，不能實踐他們的諾言而背棄離對方的人實在是太多啊！更何況在朋友已經死了之後，而能夠奉養他的至親呢？",
            "吾觀杜環事，雖古所稱義烈之士何以過！而世俗恆謂今人不逮古人，不亦誣天下人哉！": "我細察杜環的事跡，即使是古時被稱讚為俠義壯烈的人也比不上啊，世俗常說現代人不如古人，這不是枉屈了世間的人嗎？",

                        // --- 吾廬記 (2016 DSE) ---
            "季子禮，既倦於遊，南極瓊海，北抵燕，於是作屋於勺庭之左扃，曰：「此真吾廬矣！」名曰吾廬。": "（我的弟弟）魏季子禮，已經厭倦了四方遊歷的生活：他曾經去到南面盡頭的海南島，北面則到過河北一帶。回鄉後，就在勺庭的左角蓋了房子，說：「這才真是我安身的地方！」房子名叫「吾廬」。",
            "廬於翠微址最高，群山宮之，平疇崇田，參錯其下，目之所周，大約數十里，故視勺庭為勝焉。": "吾廬建築在翠微峰的最高處，群山圍繞着它；高高低低的田地，縱橫交錯，不整齊地分佈在山下；四周範圍，眼睛能夠看見的大約有數十里，環境比勺庭更幽美。",
            "於是高下其徑，折而三之。": "他又順應地勢，將小徑分折成三段。",
            "松鳴於屋上，桃、李、梅、梨、梧桐、桂、辛夷之華，蔭於徑下，架曲直之木為檻，堊以蜃灰，光耀林木。": "松聲迎風在屋頂上響着，桃樹、李樹、梅樹、梨樹、梧桐、桂樹、辛夷這些花朵，覆蓋着小路，架起了彎曲的、畢直的木條做欄杆，牆壁塗上了蚌殼灰粉，它的光澤便閃爍在林木之間了。",
            "客曰：「斗絕之山，取蔽風雨足矣。季子舉債而飾之，非也。」": "有人說：「在這陡峭的山上蓋屋，只要能遮蔽風雨就夠了。季子卻要借錢來裝飾房屋，實在沒有必要啊。」",
            "或曰：「其少衰乎？其將懷安也。」": "也有人說：「大概季子的意志有些衰頹了吧，想過安逸的生活啊。」",
            "方季子之南遊也，驅車瘴癘之鄉，蹈不測之波，去朋友，獨身無所事事而之瓊海。": "當季子走到南面蠻荒地區時，趕著車子在瘴氣毒熱鬱結的地方行走，乘著船艇在深不可測的風濤駭浪中冒險航行，遠離朋友，獨個兒甚麼事都不幹就此前去海南島。",
            "至則颶風夜發屋，臥星露之下。": "甫到那裏，就遇到大颶風，一夜之間，將房屋吹毀，只得睡在星光露天底下。",
            "兵變者再，索人而殺之，金鐵鳴於堂戶，屍交於衢，流血溝澮。": "又碰到兩次兵變，兵士到處搜索屠殺，刀劍的聲音在門外響個不停，屍體堆積在大街上，鮮血流進到溝道中。",
            "客或以聞諸家，家人憂恐泣下，余談笑飲食自若也。": "有人把消息傳到我家裏，家人擔心得哭了，我還像平日一樣談笑吃喝。",
            "及其北遊山東，方大饑，饑民十百為群，煮人肉而食。千里之地，草絕根，樹無青皮。": "及後他又向北到了山東，那裏正鬧着大饑荒，災民十來個、百來個的成群結隊，煮吃人肉充饑。方圓千里的地方，連草根樹皮都食盡了，",
            "家人聞之，益憂恐，而季子竟至燕。": "家裏的人聽到後，更加擔心害怕，但季子竟然平安地到了河北。",
            "客有讓余者曰：「子之兄弟一身矣，又唯子言之從。今季子好舉債遊，往往無故衝危難，冒險阻，而子不禁，何也？」": "有人責備我說：「你和季子兄弟至親，他又只聽從你的話，現在季子喜歡借債遠遊，常常無緣無故地頂着危難，冒險到處奔走，你卻不阻止，為什麼呢？」",
            "余笑曰：「吾固知季子之無死也。吾之視季子之舉債冒險危而遊，與舉債而飾其廬，一也。": "我笑着說：「我原先就知道季子不會死呀！在我看來，季子借債冒險遠遊，和他借債裝修屋子，是一樣道理的啊。",
            "且夫人各以得行其志為適。": "而且人人都把能夠實現自己的志願，看作適意的事情。",
            "終身守閨門之內，遇異趨越，蓋井而觀，腰舟而渡，遇三尺之溝，則色變不敢跳越，若是者，吾不強之適江湖。": "一個整輩子守在家門之內的人，連走一步路也瞻前顧後、似進非進；蓋上了井蓋才敢俯身看井，腰間繫着葫蘆才敢泅水；一見三尺寬的溝渠，立即大驚失色，不敢跳越；像這樣的人，我決不會強使他到江湖闖蕩。",
            "好極山川之奇，求朋友，攬風土之變，視客死如家，死亂如死病，江湖之死如衽席，若是者，吾不強之使守其家。": "反之，如果喜歡縱情在奇異的山水景色，尋訪良朋好友，採集了解各地不同的風土人情，把死在外地看作死在家裏，死在變亂中看作死於疾病，死在江湖間看作死在床席上一樣；像這樣的人，我決不會勉強他坐守在家裏。",
            "孔子曰：『志士不忘在溝壑。』夫若是者，吾所不能也。吾不能而余弟能之，其志且樂為之，而吾何暇禁？」": "孔子說：『有志氣的人，即使是死在山溝裏，也不以為恨。』像這樣的精神行為，我自己雖然做不到，而子弟們卻能做到，並且正是出於他們的志趣並樂於去做，我連贊成都來不及，哪有功夫去阻止呢？」",
            "季子為余言：渡海時舟中人眩怖不敢起，獨起視海中月，作《乘月渡海歌》一首；": "季子還對我說過：渡海時，同船的人都被風浪顛簸得頭暈心驚、不敢起床站立，只有他能獨自起身，觀賞海上月色，還作了一首《乘月渡海歌》。",
            "兵變，闔門而坐，作《海南道中詩》三十首。": "兵變時，他也鎮定地閉門而坐，作了三十首《海南道中詩》。",
            "余乃笑吾幸不憂恐泣下也。": "聽了這些，我便暗笑自己幸虧沒有像家裏人那樣嚇得哭起來。",
            "廬既成，易堂諸子，自伯兄而下皆有詩；四方之士聞者，咸以詩來會，而余為之記。": "吾廬蓋好了後，易堂中諸位先生，從我兄長以下每人都寫詩紀念，各地文士知道這個消息後，也都作了詩，齊來聚會，我就寫了這篇《吾廬記》。",

                        // --- 試筆說 (2020 DSE) ---
            "吾居乎鄉，客遺善筆二。": "我居住在鄉里，客人送我兩枝好筆。",
            "分其一於友人，而用其一。": "其中一枝送給朋友，另一枝自己使用。",
            "銳而端，圓而勁，以摹畫，咸與心稱，": "（這枝筆）精尖端直，鋒毫圓勁，用來寫字繪畫，都稱心如意，",
            "愛之不忍妄用，遇佳紙墨泊文辭則以書，書畢，滌而藏之。": "（因此我）愛惜它不忍心隨便使用，遇到好的紙墨為文章潤色才用它書寫，書寫完畢，就洗乾淨收藏起來。",
            "恣意率手有所作，則用其次者，是以雖甚久而猶新焉。": "隨意書寫另外的雜事，就用其他質素較次的筆來寫，所以這枝筆雖然用了很久卻還像新的一樣。",
            "他日友人至，問其所得，則曰弊而棄之矣。": "有一天好朋友過來，問起他所得到的那枝筆，他回答說已經破舊丟掉了。",
            "詰其用，則紀錢粟貨利卑猥事，不稍惜，視之與里巷所為偏欹軟惡者等，不知其為美也。吾聞而歎之。": "問他是怎麼用的，原來記錄那些錢米買賣等低等事也用它寫，不怎愛惜，把它看得像鄉間破敗鄙陋的東西一樣，不懂得這枝筆的優越之處。我聽了為之感歎。",
            "友人曰：「子何歎之細也，以余用斯筆也，而違其任，余則有過矣。": "朋友說：「你為何為這種小事而感歎呢？我用這種筆寫無關緊要的事，違背了毛筆真正的作用，我是有過錯的。",
            "雖然，世之用人者，得無有甚於余之用筆者乎？": "雖然如此，世上任用人才者的過錯，恐怕遠超過我粗用這枝筆（所犯的錯）吧？",
            "筆易為也，美者易得也，用久必敝，固其職也。": "筆容易製作，好筆也容易得到；用久以後必然破敗，這本來就是毛筆盡職的結果。",
            "今夫所謂賢士君子者，天之生也難，生而不夭死，不疾病，獲全其美也尤難。": "今天那些所謂的賢士、君子，上天造就一個也困難，生下來後沒有夭折、沒有生病、得到保全的尤其難以做到。",
            "然而用之者，不任之以立政教，修紀法，居廟朝，治海內，而卑位冗職是命。": "然而那些任用他們的人，不讓他們制定法令教化制度、修訂國家的綱紀法律、在朝廷做官、治理天下，卻任命他們擔任低微閒散的職務。",
            "一不快於意，不待其敝而棄之。且加不勝之法焉者，亦眾矣。": "稍不滿意，不等到他們衰老就棄而不用；而且加以不能勝任的職務，亦太多了。",
            "不彼之歎，而於筆焉惜，是尚為知類也哉？」": "你不感歎那些事，卻為這枝筆感到惋惜，你（這種態度）還能算是明白事理的人嗎？」",
            "吾愧乎其言，謂之曰：「筆吾所任也，故吾知愛而歎之。": "我為他的話感到羞愧，對他說：「筆是我能使用的，因此我知道愛惜它並為它感歎。",
            "任人非吾事也，吾其敢僭而歎乎？": "任用人才不是我的分內事，我哪敢僭越本份去感歎呢？",
            "若姑修其可任者，以待人之任己，何暇乎世之歎，而吾之疑邪！」": "你姑且努力做好你能勝任的工作來等待別人任用自己，哪裏有空閒顧及世人感歎、我的困惑呢？」",


            

        };

        const form = document.getElementById('searchForm');
        const input = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');
        const dictAction = document.getElementById('dictAction');
        // 切割句子的正則表達式，遇到句號、問號、歎號等自動換行
        const sentenceSplitter = /[^。！？!\?；;\n]+[。！？!\?；;\n]?/g;

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const keyword = input.value.trim();
            if(!keyword) return;

            performSearch(keyword);
            setupDictionaryLink(keyword);
        });

        function performSearch(keyword) {
            resultsContainer.innerHTML = '';
            
            // 安全處理關鍵字，確保能準確搜尋
            const safeKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const searchRegex = new RegExp(safeKeyword, 'gi');

            let totalMatches = 0;
            const results = [];

            textsDatabase.forEach(textObj => {
                const sentences = textObj.content.match(sentenceSplitter) || [];
                sentences.forEach(sentence => {
                    if (sentence.match(searchRegex)) {
                        results.push({
                            id: 'res_' + Math.random().toString(36).substr(2, 9),
                            title: textObj.title,
                            author: textObj.author,
                            originalText: sentence.trim()
                        });
                        totalMatches++;
                    }
                });
            });

            if (totalMatches === 0) {
                resultsContainer.innerHTML = `
                    <div class="bg-red-50 text-red-600 p-6 rounded-xl border border-red-100 text-center shadow-sm">
                        <p class="text-lg font-medium">找不到包含「${keyword}」的句子。</p>
                        <p class="text-sm mt-1">請確保字詞輸入正確，或確認該篇章內容已貼入資料庫中。</p>
                    </div>
                `;
                return;
            }

            const summaryDiv = document.createElement('div');
            summaryDiv.className = 'text-slate-600 font-medium pb-2 border-b border-slate-200 mt-2';
            summaryDiv.innerText = `找到 ${totalMatches} 句包含「${keyword}」的原文：`;
            resultsContainer.appendChild(summaryDiv);

            results.forEach((res) => {
                // 將關鍵字標記為黃色底色
                const highlightedHtml = res.originalText.replace(
                    searchRegex, 
                    (match) => `<mark>${match}</mark>`
                );

                // 🔍 嘗試在資料庫中尋找有沒有配對的語譯
                let translationText = null;
                for (const [ori, trans] of Object.entries(translationsDatabase)) {
                    if (res.originalText.includes(ori) || ori.includes(res.originalText)) {
                        translationText = trans;
                        break;
                    }
                }

                const card = document.createElement('div');
                card.className = 'bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow flex flex-col';

                // 根據是否有語譯，決定顯示邏輯 (現在無論如何都會顯示 Google 按鈕)
                let translationHtml = '';
                
                if (translationText) {
                    translationHtml += `
                    <div class="mt-4 bg-emerald-50 border-l-4 border-emerald-500 p-4 rounded-r-lg mb-1">
                        <p class="text-sm font-bold text-emerald-800 mb-1">📖 標準語譯：</p>
                        <p class="text-slate-700 text-base leading-relaxed">${translationText}</p>
                    </div>
                    `;
                }

                // 常駐的 Google 搜尋備用按鈕 (設定為稍淡的灰色系以區分層次)
                translationHtml += `
                <div class="mt-3">
                    <a href="https://www.google.com/search?q=${encodeURIComponent('"' + res.title + '" ' + res.originalText + ' 語譯')}" target="_blank" rel="noopener noreferrer" class="bg-slate-50 hover:bg-slate-100 text-slate-600 px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center justify-center gap-2 w-fit border border-slate-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                        Google 搜尋語譯 ↗
                    </a>
                </div>
                `;

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2">
                            <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-2 py-1 rounded">${res.title}</span>
                            <span class="text-slate-500 text-sm font-medium border-l border-slate-300 pl-2">${res.author}</span>
                        </div>
                    </div>
                    <p class="text-lg text-slate-800 leading-relaxed mb-1 font-serif">${highlightedHtml}</p>
                    ${translationHtml}
                `;
                resultsContainer.appendChild(card);
            });
        }

        function setupDictionaryLink(keyword) {
            dictAction.classList.remove('hidden');
            if (keyword.length > 4) return dictAction.classList.add('hidden'); // 太長不顯示字典
            
            const encodedKeyword = encodeURIComponent(keyword);
            const zdicUrl = `https://www.zdic.net/hans/${encodedKeyword}`;

            dictAction.innerHTML = `
                <div class="flex flex-col sm:flex-row items-center gap-3 bg-blue-50 p-4 rounded-xl border border-blue-100 mt-2">
                    <div class="flex-grow text-blue-800 text-sm">
                        想了解單字<strong>「${keyword}」</strong>的詳細字義？
                    </div>
                    <a href="${zdicUrl}" target="_blank" rel="noopener noreferrer" class="bg-white text-blue-600 border border-blue-200 hover:bg-blue-600 hover:text-white transition-colors px-4 py-2 rounded-lg font-medium text-sm shadow-sm flex items-center gap-2">
                        前往漢典查字
                    </a>
                </div>
            `;
        }
    </script>
</body>
